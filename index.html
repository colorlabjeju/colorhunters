<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#224653">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="컬러헌터스">
<title>컬러헌터스</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=4" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+KR:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  /* 팔레트: Silver Birch #D5DCDF · Blackthorn Berry #224653 · Willow Leaf #86915D */
  --birch:#D5DCDF; --berry:#224653; --willow:#86915D;
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#212121; --ink2:#404040; --ink3:#6E6E6E; --line:#E3E3E3; --line2:#EFEFEF; --panel:#F5F6F4;
  --accent:#6B7548; --accent-ink:#FFFFFF; --accent-text:#5E6840; --soft:#E9ECDD;
  --sea:#2C6E9B; --forest:#4D7A35; --flower:#B84A62;
  --warn-bg:#F6EED8; --warn-ink:#6E4A0C; --bad-bg:#F6E9EA; --bad-ink:#9C3A4E; --ok-bg:#E9ECDD; --ok-ink:#4F5A35;
  --font:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; --display:'Oswald','Pretendard Variable',Pretendard,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink2);font-family:var(--font);font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--berry);color:#F8FAFA;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top b{font-size:17px;letter-spacing:-.01em}
.top small{font-size:13px;color:#B9C6CB}
.top a{color:#F8FAFA;font-size:15px;text-decoration:none;border:1px solid #4A6B77;border-radius:10px;padding:6px 12px}
main{max-width:560px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 56px);display:flex;flex-direction:column;gap:16px}
main.wide{max-width:1180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.h1{font-size:26px;line-height:1.3;font-weight:700;color:var(--ink)}
.h2{font-size:21px;line-height:1.35;font-weight:700;color:var(--ink)}
.h3{font-size:18px;font-weight:700;color:var(--ink)}
.muted{color:var(--ink3)}
.small{font-size:15px}
.xs{font-size:13px}
.eyebrow{font-size:14px;font-weight:700;color:var(--accent-text);letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--berry);border-color:var(--berry);color:#F8FAFA}
.btn.light{border-color:var(--line);color:var(--ink2);font-weight:500}
.btn.block{width:100%}
.btn.sm{min-height:44px;font-size:16px;padding:0 14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:8px 4px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:16px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.choice b{font-size:19px;color:var(--ink)}
.choice span{font-size:15px;color:var(--ink3)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
.chip[aria-pressed="true"]{border-color:var(--berry);background:var(--berry);color:#F8FAFA;font-weight:700}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:16px;border:3px solid var(--line);background:var(--card);cursor:pointer}
.ring i{width:46px;height:46px;border-radius:50%;border:8px solid currentColor;display:block}
.ring b{font-size:20px}
.ring span{font-size:13px;color:var(--ink3);text-align:center;line-height:1.35}
/* 색 잣대 고르기: 실물을 닮은 작은 그림 */
.ring.tool{gap:4px;padding:12px 8px}
.ring.tool svg{width:58px;height:65px;display:block}
.ring.tool b{font-size:17px}
details.why{padding:12px 14px}
details.why summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:'＋';color:var(--ink3);font-weight:700}
details.why[open] summary::after{content:'－'}
details.why p{margin:8px 0 0;line-height:1.6}
.ring[aria-pressed="true"]{border-color:currentColor;background:var(--soft)}
/* 키링 칸 고르기 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.cell{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4px;border:3px solid transparent;border-radius:6px;background:none;cursor:pointer;font:inherit}
.cell i{display:block;height:52px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cell span{font-size:13px;color:var(--ink3);text-align:center;letter-spacing:.02em}
.cell[aria-pressed="true"]{border-color:var(--berry)}
.cell[aria-pressed="true"] span{color:var(--ink);font-weight:600}
.sw{display:inline-block;width:22px;height:22px;border-radius:3px;vertical-align:-5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
/* 장소 스탬프 */
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:2px dashed var(--line);border-radius:6px;text-align:center;font-size:14px;line-height:1.3;color:var(--ink3)}
.stamp i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px}
.stamp.on{border-style:solid;border-color:var(--flower);color:var(--ink)}
.stamp.on i{background:var(--flower);border-color:var(--flower);color:#fff}
.progress{display:flex;gap:5px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--willow)}
.shot{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#DCE2E5;display:flex;align-items:center;justify-content:center;position:relative}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .badge{position:absolute;left:10px;top:10px;background:rgba(34,70,83,.88);color:#fff;border-radius:8px;padding:2px 10px;font-size:14px;font-weight:700}
.tips{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:16px}
.notice{padding:14px 16px;border-radius:14px;background:var(--warn-bg);color:var(--warn-ink);font-size:16px}
.err{padding:14px 16px;border-radius:14px;background:var(--bad-bg);color:var(--bad-ink);font-size:16px}
.ok{padding:14px 16px;border-radius:14px;background:var(--ok-bg);color:var(--ok-ink);font-size:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;color:var(--ink);font-size:18px}
.field .hint{font-size:14px;color:var(--ink3)}
.whenform{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1.3fr) minmax(0,1fr);gap:6px}
.whenform .input{min-width:0;padding-left:8px;padding-right:8px}
.input{width:100%;min-height:54px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:18px}
textarea.input{min-height:120px;line-height:1.55;resize:vertical}
.input:focus{border-color:var(--accent);outline:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px;line-height:1.2;color:var(--ink)}
.stat span{font-size:14px;color:var(--ink3)}
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;background:var(--birch);color:var(--ink2)}
.tag.ok{background:var(--ok-bg);color:var(--ok-ink)}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.bad{background:var(--bad-bg);color:var(--bad-ink)}
.rec{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;cursor:pointer;color:var(--ink2)}
.rec .th{width:76px;height:76px;border-radius:10px;background:#DCE2E5;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3)}
.rec .th img{width:100%;height:100%;object-fit:cover}
.rec.held{border:2px solid #D9B25E;background:#FBF6E8}
.map{height:260px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.check input{width:26px;height:26px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:50;max-width:92vw}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 관리자 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.adm{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:900px){.adm{grid-template-columns:360px minmax(0,1fr)}}
.qlist{display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow:auto}
.qitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;font-size:15px;color:var(--ink2)}
.qitem[aria-current="true"]{border:2px solid var(--accent);background:var(--soft)}
.qitem .th{width:56px;height:56px;border-radius:8px;background:#DCE2E5;overflow:hidden}
.qitem .th img{width:100%;height:100%;object-fit:cover}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.pics figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pics .ph{background:#1B3640;border-radius:12px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px}
.pics img{width:100%;height:100%;object-fit:contain}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--ink3);font-weight:500;font-size:13px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
.hero{display:flex;flex-direction:column;gap:10px;padding:8px 2px 4px}
.projs{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){.projs{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}}
.proj{display:grid;grid-template-columns:42% minmax(0,1fr);min-height:240px;padding:0;border:0;background:#E2E7E7;text-align:left;cursor:pointer;font:inherit;color:inherit;overflow:hidden}
.proj:hover .pmore,.proj:focus-visible .pmore{border-color:var(--ink)}
.pimg{position:relative;overflow:hidden;background:var(--birch)}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.swatch{position:absolute;inset:0;display:flex}
.swatch i{display:block;height:100%}
.pbody{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px 20px}
.ptag{display:inline-block;padding:5px 10px;border:1px solid #C3CCCF;background:#F3F6F6;color:var(--accent-text);font-size:13px;line-height:1.3}
.ptitle{font-size:24px;line-height:1.3;font-weight:700;color:var(--ink);margin-top:6px}
.pdesc{font-size:15px;line-height:1.6;color:var(--ink3)}
.pmore{margin-top:auto;padding:12px 0 6px;font-size:15px;font-weight:500;color:var(--ink);border-bottom:1px solid #9FAEB3}
@media(max-width:480px){.proj{grid-template-columns:34% minmax(0,1fr);min-height:220px}.pbody{padding:18px 14px;gap:8px}.ptag{font-size:12px;padding:4px 8px;white-space:nowrap}.ptitle{font-size:22px}}
.aboutimg{position:relative;height:150px;overflow:hidden;background:var(--birch)}
.aboutimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* 미션 소개 — 탭(소개 | 모인 기록 | 내 기록), 좁은 화면은 아래 고정 줄, 넓은 화면은 왼쪽 단 고정 */
main.about{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
.ab{display:flex;flex-direction:column;gap:16px}
.ab-side,.ab-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.ab-side>*{flex:none}
.ab-acts,.ab-fold{display:none}
.ab:not([data-tab=intro]) .ab-hero,.ab:not([data-tab=intro]) .ab-lead{display:none}
.ab-pane{display:none;flex-direction:column;gap:14px}
.ab[data-tab=intro] .pane-intro,.ab[data-tab=records] .pane-records{display:flex}
.abtabs{display:flex;gap:22px;border-bottom:1px solid var(--e-line,var(--line))}
.abtabs a{padding:10px 0;text-decoration:none;color:var(--e-mute,var(--ink3));border-bottom:2px solid transparent;margin-bottom:-1px;font-size:15px;white-space:nowrap}
.abtabs a[aria-current=page]{color:var(--e-ink,var(--ink));border-bottom-color:currentColor;font-weight:600}
.abtabs a b,.ab-bar .mine b{color:var(--e-clay,#A6503F);font-weight:600;font-size:13px}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap-reverse;justify-content:flex-end}
.gchips{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gchips::-webkit-scrollbar{display:none}
.gchips button{flex:none;border:1px solid var(--e-line,var(--line));background:#fff;border-radius:999px;padding:6px 13px;font-size:14px;min-height:36px;cursor:pointer;white-space:nowrap;color:inherit;font-family:inherit}
.gchips button[aria-pressed=true]{background:var(--e-green,#2F4A3E);border-color:var(--e-green,#2F4A3E);color:#fff}
.seg{display:inline-flex;flex:none;border:1px solid var(--e-line,var(--line));border-radius:999px;overflow:hidden;background:#fff}
.seg[hidden]{display:none}
.seg button{border:0;background:none;padding:6px 14px;font-size:14px;min-height:36px;cursor:pointer;color:inherit;font-family:inherit}
.seg button[aria-pressed=true]{background:var(--e-ink,#242A26);color:#fff}
.gal.colors{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.ctile{display:flex;flex-direction:column;gap:1px;padding:0;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0}
.ctile .cq{display:grid;grid-template-rows:64% 36%;grid-template-columns:1fr 1fr;aspect-ratio:1;width:100%;background:#DCE2E5}
.ctile .cq.none{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3)}
.ctile .cq i{display:block}
.ctile .cq i:first-child{grid-column:1/3}
.ctile b{font-size:13px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctile .s{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rec4 button{padding:0;border:0;background:#DCE2E5;aspect-ratio:1;position:relative;overflow:hidden;cursor:pointer}
.rec4 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rec4 .cband{position:absolute;left:0;right:0;bottom:0;gap:0}
.fold{border-top:1px solid var(--e-line,var(--line));padding:12px 2px}
.fold:last-child{border-bottom:1px solid var(--e-line,var(--line))}
.fold summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:'▸';font-size:12px;color:var(--ink3)}
.fold[open] summary::after{content:'▾'}
.fold[open] summary{margin-bottom:8px}
.ab-mine{display:flex;justify-content:space-between;text-decoration:none}
.ab-bar{position:fixed;left:0;right:0;bottom:0;z-index:18;display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--e-bg,#FBFAF7);border-top:1px solid var(--e-line,var(--line))}
.ab-bar .btn{min-height:48px;text-decoration:none}
.ab-bar .mine{flex:none;background:#fff}
.ab-bar .btn,.ab-acts .btn{display:flex;align-items:center;justify-content:center;text-align:center}
.ab-acts .ab-mine{justify-content:space-between}
.ab-bar .rec{flex:1}
.ab-bar .btn.main.rec,body.ed .ab-bar .btn.main.rec,body.ed .ab-acts .btn.main.block{background:var(--e-green,#2F4A3E);border-color:var(--e-green,#2F4A3E);color:#fff}
@media(min-width:700px){
  main.about{max-width:1240px;padding-left:32px;padding-right:32px;padding-bottom:56px}
  .ab{display:grid;grid-template-columns:340px minmax(0,1fr);gap:36px;align-items:start}
  .ab-side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;padding-right:2px}
  .ab .ab-side .ab-hero,.ab .ab-side .ab-lead{display:block}
  .ab-acts{display:flex;flex-direction:column;gap:8px}
  .ab-fold{display:block}
  .abtabs .tab-intro{display:none}
  .ab[data-tab] .pane-intro{display:none}
  .ab[data-tab] .pane-records{display:flex}
  .ab[data-tab=intro] .abtabs .tab-records{color:var(--e-ink,var(--ink));border-bottom-color:currentColor;font-weight:600}
  .gbar{flex-wrap:nowrap}
  .gchips{flex:1 1 auto;flex-wrap:wrap;overflow:visible}
  .ab .gal{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .ab .gal.colors{grid-template-columns:repeat(6,minmax(0,1fr))}
  .ab-bar{display:none}
}
@media(min-width:700px) and (max-width:999px){.ab{grid-template-columns:280px minmax(0,1fr);gap:24px}.ab .gal{grid-template-columns:repeat(3,minmax(0,1fr))}.ab .gal.colors{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gcard{display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);text-align:left;cursor:pointer;font:inherit;color:inherit}
.gimg{aspect-ratio:1;background:#DCE2E5;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:14px}
.gimg{position:relative;overflow:hidden}
.gimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.gcard.mine{cursor:default}

  const px=(x,y)=>{ const i=(y*W+x)*4; return rgb2lab(data[i],data[i+1],data[i+2]); };
  /* 짚은 점: 3×3 평균 */
  let s=[0,0,0], n=0;
  for(let y=cy-1;y<=cy+1;y++) for(let x=cx-1;x<=cx+1;x++){ if(x<0||y<0||x>=W||y>=H) continue; const i=(y*W+x)*4; s[0]+=data[i]; s[1]+=data[i+1]; s[2]+=data[i+2]; n++; }
  const pLab=rgb2lab(s[0]/n, s[1]/n, s[2]/n), point={lab:pLab.map(r1), hex:lab2hex(...pLab)};
  const collect=strict=>{ const out=[]; for(let y=Math.max(0,Math.floor(cy-R)); y<=Math.min(H-1,Math.ceil(cy+R)); y++) for(let x=Math.max(0,Math.floor(cx-R)); x<=Math.min(W-1,Math.ceil(cx+R)); x++){
      if((x-cx)*(x-cx)+(y-cy)*(y-cy)>R*R) continue; const l=px(x,y); if(strict && (l[0]<COLORS.minL || l[0]>COLORS.maxL)) continue; out.push(l); } return out; };
  let pts=collect(true); if(pts.length<60) pts=collect(false);   /* 거의 다 걸러지면(아주 어둡거나 밝은 대상) 그대로 쓴다 */
  const N=pts.length, k=Math.min(COLORS.k, N), F=pts.map(l=>[l[0]*wL, l[1], l[2]]);
  const d2=(p,q)=>(p[0]-q[0])*(p[0]-q[0])+(p[1]-q[1])*(p[1]-q[1])+(p[2]-q[2])*(p[2]-q[2]);
  /* 처음 중심: 전체 평균에 가장 가까운 점에서 시작해, 이미 고른 중심들에서 가장 먼 점을 차례로 (매번 같은 결과) */
  const mean=F.reduce((m,p)=>[m[0]+p[0]/N,m[1]+p[1]/N,m[2]+p[2]/N],[0,0,0]);
  let first=0, best=Infinity; F.forEach((p,i)=>{ const d=d2(p,mean); if(d<best){ best=d; first=i; } });
  const cen=[F[first].slice()], md=F.map(p=>d2(p,cen[0]));
  while(cen.length<k){ let far=0; for(let i=1;i<N;i++) if(md[i]>md[far]) far=i; cen.push(F[far].slice()); for(let i=0;i<N;i++){ const d=d2(F[i],cen[cen.length-1]); if(d<md[i]) md[i]=d; } }
  const lab=new Int32Array(N);
  const assign=()=>{ let ch=0; for(let i=0;i<N;i++){ let b=0, bd=Infinity; for(let c=0;c<k;c++){ const d=d2(F[i],cen[c]); if(d<bd){ bd=d; b=c; } } if(lab[i]!==b){ lab[i]=b; ch++; } } return ch; };
  for(let it=0; it<20; it++){
    const ch=assign(); if(it && !ch) break;
    const sum=cen.map(()=>[0,0,0,0]); for(let i=0;i<N;i++){ const t=sum[lab[i]]; t[0]+=F[i][0]; t[1]+=F[i][1]; t[2]+=F[i][2]; t[3]++; }
    sum.forEach((t,c)=>{ if(t[3]) cen[c]=[t[0]/t[3],t[1]/t[3],t[2]/t[3]]; });
  }
  assign();
  /* 군집마다 중심에 가까운 80%만 평균 (가장자리·섞인 픽셀 제외) */
  const groups=cen.map(()=>[]); for(let i=0;i<N;i++) groups[lab[i]].push(i);
  let cl=groups.map((g,c)=>{ if(!g.length) return null;
    const near=g.map(i=>[d2(F[i],cen[c]),i]).sort((a,b)=>a[0]-b[0]).slice(0, Math.max(1, Math.round(g.length*COLORS.keep)));
    const m=near.reduce((t,[,i])=>[t[0]+pts[i][0],t[1]+pts[i][1],t[2]+pts[i][2]],[0,0,0]).map(v=>v/near.length);
    return {lab:m.map(r1), hex:lab2hex(...m), share:Math.round(g.length/N*1000)/1000, c}; }).filter(Boolean);
  /* 짚은 점이 속한 군집 */
  const pf=[pLab[0]*wL,pLab[1],pLab[2]]; let pc=cl[0].c, pd=Infinity; cl.forEach(x=>{ const d=d2(pf,cen[x.c]); if(d<pd){ pd=d; pc=x.c; } });
  cl.sort((a,b)=>b.share-a.share);
  const pick=cl.findIndex(x=>x.c===pc); cl=cl.map(({c,...x})=>x);
  return {clusters:cl, pick, point};
}
/* 저장할 모양: 내가 본 색 1 + 함께 보인 색 2 (나머지 중 넓은 순, 이미 고른 색과 ΔE00 5 미만이면 건너뜀). main: 군집 번호 또는 'point' */
function buildColors(ex, main, roi){
  const m = main==='point' ? {role:'main', from:'point', hex:ex.point.hex, lab:ex.point.lab} : Object.assign({role:'main', from:'cluster'}, ex.clusters[main]);
  const out=[m];
  ex.clusters.forEach((c,i)=>{ if(out.length>=3 || i===main) return; if(out.some(o=>deltaE00(o.lab,c.lab)<COLORS.minDE)) return; out.push(Object.assign({role:'sub', from:'cluster'}, c)); });
  return {method:COLORS.method, calibrated:false, weightL:COLORS.weightL, roi:{photo:roi.photo, x:roi.x, y:roi.y, r:COLORS.roi}, colors:out, clusters5:ex.clusters};
}

/* 미리보기(약 400px) 픽셀 읽기 */
async function previewPixels(blob){
  const bmp=await createImageBitmap(blob); const sc=Math.min(1, PREVIEW.max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(bmp.width*sc)); c.height=Math.max(1,Math.round(bmp.height*sc));
  const ctx=c.getContext('2d',{willReadFrequently:true}); ctx.drawImage(bmp,0,0,c.width,c.height);
  const d=ctx.getImageData(0,0,c.width,c.height); c.width=c.height=0; if(bmp.close) bmp.close(); return d;
}
/* 사진 p에서 짚은 대상(p.txy) 둘레의 색을 찾아 p.cx(5색)·p.cmain(내가 본 색: 군집 번호 또는 'point')에 둔다 */
async function findColors(p){
  const pt=p.txy; p.cx=null; p.cmain=null; p.cerr=false;
  try{ const ex=extractColors(await previewPixels(p.sblob||p.blob), pt); if(p.txy===pt){ p.cx=ex; p.cmain=ex.pick; } }
  catch(e){ if(p.txy===pt) p.cerr=true; }
}
const draftColors = (p, photo) => (p && p.txy && p.cx && p.cmain!=null) ? buildColors(p.cx, p.cmain, {photo, x:p.txy.x, y:p.txy.y}) : null;
/* 정사각 카드로 자를 때 가운데가 아니라 짚은 대상을 기준으로 */
const focusStyle = f => { f=okXY(f); return f ? ` style="object-position:${(f.x*100).toFixed(1)}% ${(f.y*100).toFixed(1)}%"` : ''; };
/* 3색 띠 (내가 본 색 2 : 함께 보인 색 1 : 1) */
const HEXOK = /^#[0-9A-Fa-f]{6}$/;
const okColors = c => (c && Array.isArray(c.colors)) ? Object.assign({}, c, {colors:c.colors.filter(x=>x && HEXOK.test(x.hex||'')).slice(0,3)}) : null;
const okXY = o => (o && o.x>=0 && o.x<=1 && o.y>=0 && o.y<=1) ? {x:+o.x, y:+o.y} : null;
function colorBand(c, ht){ c=okColors(c); const cs=(c&&c.colors)||[]; return cs.length ? `<div class="cband" style="height:${ht||12}px" role="img" aria-label="이 기록의 색 ${cs.map(x=>x.hex).join(', ')}">${cs.map((x,i)=>`<i style="flex:${i?1:2};background:${h(x.hex)}"></i>`).join('')}</div>` : ''; }
const calTag = c => `<span class="tag" style="border:1px solid var(--line);background:transparent;border-radius:999px">${c&&c.calibrated?'보정됨':'보정 전'}</span>`;
function colorBlock(c){
  c=okColors(c); const cs=(c&&c.colors)||[]; if(!cs.length) return '';
  const pct=x=>x.share!=null?` · ${Math.round(x.share*100)}%`:'';
  return `<div class="cblock"><div class="row between"><b>이 기록의 색</b>${calTag(c)}</div>
    ${colorBand(c, 44)}
    <div class="clabs">${cs.map((x,i)=>`<span style="flex:${i?1:2}"><b>${i?'함께 보인 색':'내가 본 색'}</b><br><span class="xs muted">${h(x.hex)}${pct(x)}</span></span>`).join('')}</div>
    <p class="xs muted">${c.calibrated?'키링에 견주어 보정한 색이에요.':'사진 그대로의 색이에요. 키링 보정이 끝나면 «보정됨»으로 바뀌고 숫자가 조금 달라질 수 있어요.'}</p></div>`;
}
/* 색을 뽑은 곳: 짚은 점(작은 원)과 둘레(점선 원). 사진 폭·높이를 알아야 원이 동그랗게 그려진다 */
function roiMarks(pt, w, hh, r){
  const d=2*(r||COLORS.roi)*Math.min(w,hh)/w*100, pos=`left:${(pt.x*100).toFixed(2)}%;top:${(pt.y*100).toFixed(2)}%;transform:translate(-50%,-50%);position:absolute;pointer-events:none;border-radius:50%`;
  return `<span aria-hidden="true" style="${pos};width:${d.toFixed(2)}%;aspect-ratio:1;border:2px dashed rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(0,0,0,.25)"></span>`;
}
/* 기록하기: 5색 칩에서 «내가 본 색» 고르기 */
function vColorPick(p, photo){
  if(!p || !p.txy) return '';
  if(p.cerr) return `<div class="notice small">색을 찾지 못했어요. 색 없이 올려도 괜찮아요. 다시 하려면 «다시 짚기»를 눌러 주세요.</div>`;
  if(!p.cx) return `<p class="small muted"><span class="spinner"></span> 짚은 곳의 색을 찾고 있어요…</p>`;
  const cl=p.cx.clusters, out=draftColors(p, photo);
  return `<div class="stack" style="gap:10px" id="cpick">
    <div class="notice small" style="margin:0">짚은 곳 둘레(점선)에서 ${cl.length}가지 색을 찾았어요. <b>눈으로 본 색</b>에 가장 가까운 칸을 눌러 주세요.</div>
    <div class="cchips">${cl.map((c,i)=>`<button type="button" data-cmain="${i}" aria-pressed="${p.cmain===i}" aria-label="${h(c.hex)} ${Math.round(c.share*100)}%"><i style="background:${h(c.hex)}"></i><span>${p.cmain===i?'내가 본 색':Math.round(c.share*100)+'%'}</span></button>`).join('')}</div>
    <div class="cband" style="height:6px">${cl.map(c=>`<i style="flex:${Math.max(c.share,0.01)};background:${h(c.hex)}"></i>`).join('')}</div>
    <div class="row between"><b class="small">저장될 3색</b><span class="xs muted">함께 보인 색은 넓은 순으로 자동</span></div>
    ${colorBand(out, 30)}
    <button type="button" class="link" data-cmain="point" style="align-self:flex-start">${p.cmain==='point'?'✓ 짚은 점의 색 그대로 저장해요':'딱 맞는 색이 없어요 (짚은 점의 색 그대로 저장)'}${p.cmain==='point'?` <i style="display:inline-block;width:14px;height:14px;vertical-align:-2px;border:1px solid var(--line);background:${h(p.cx.point.hex)}"></i>`:''}</button>
  </div>`;
}
async function takePhoto(file, which){

function mb(n){ return n>=1024*1024 ? (n/1048576).toFixed(1)+'MB' : Math.max(1,Math.round(n/1024))+'KB'; }
function sizeNote(p){ return p ? `<p class="xs muted">원본 ${mb(p.bytes)} → 올릴 크기 ${mb(p.sent)} (${p.ow}×${p.oh}px, 색 비교용으로 자동 축소)</p>` : ''; }

/* ================= 인증·초대 ================= */
async function ensureSession(){
  const {data:{session}} = await sb.auth.getSession();
  if(session) { S.user = session.user; return session.user; }
  const {data, error} = await sb.auth.signInAnonymously();
  if(error) throw error;
  S.user = data.user; return data.user;
}
async function redeem(token){
  await ensureSession();
  const {data, error} = await sb.rpc('redeem_invite', {p_token: token});
  if(error) throw error;
  localStorage.setItem('ch_invite', token);
  S.me = data; localStorage.setItem('ch_me', JSON.stringify(data));
  return data;
}
async function loadMe(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){
    const tok = localStorage.getItem('ch_invite');
    if(tok){ try{ await redeem(tok); return true; }catch(e){ return false; } }
    return false;
  }
  S.user = session.user;
  const {data:roles} = await sb.from('user_roles').select('role,edition').eq('user_id', S.user.id);
  if(!roles || !roles.length){
    const tok = localStorage.getItem('ch_invite');
    if(tok && isAnonUser()){ try{ await redeem(tok); return true; }catch(e){ return false; } }
    return false;
  }
  const cached = JSON.parse(localStorage.getItem('ch_me')||'null');
  const role = (roles.find(x=>x.role==='admin')||roles[0]).role;
  S.me = Object.assign({nickname:'', consent_at:null}, cached||{}, {role});
  /* 서버에 있는 별칭·동의 상태를 가져온다 — 다른 기기에서 로그인해도 그대로 */
  let mi=null; try{ ({data:mi} = await sb.rpc('my_invite')); }catch(e){}
  if(mi && mi[0]){ Object.assign(S.me, {nickname:mi[0].nickname, consent_at:mi[0].consent_at, login_id:mi[0].login_id}); localStorage.setItem('ch_me', JSON.stringify(S.me)); }
  return true;
}

async function accountCall(body){
  const {data:{session}} = await sb.auth.getSession();
  const headers = {'Content-Type':'application/json', apikey: SUPABASE_KEY};
  if(session) headers.Authorization = 'Bearer ' + session.access_token;
  let res;
  try{ res = await withTimeout(fetch(ACCOUNT_FN, {method:'POST', headers, body: JSON.stringify(body)}), 20000); }
  catch(e){ throw new Error('인터넷 연결이 약해요. 신호가 잡히는 곳에서 다시 눌러 주세요.'); }
  const j = await res.json().catch(()=>({error:'server'}));
  if(!res.ok || j.error) throw new Error(ACC_ERR[j.error] || ACC_ERR.server);

}

async function loadEdition(){

}
async function loadMine(){

async function useEd(ed){
  if(CUR===ed && S.edLoaded===ed.slug) return;
  CUR = ed; S.edLoaded = ed.slug; S.records = []; S.queue = [];
  if(S.draft && S.draft.ed!==ed.slug) S.draft = null;
  await loadEdition().catch(()=>{});
  if(ed.tool) await loadChips(ed.tool).catch(()=>{});
  if(hasId()) await loadMine().catch(()=>{});
}
/* 키링 칸(측색값)은 tool_chips에서. 링별 측색표 순서(밝기순)로 보여 준다 — 실제 칸 위치(pos)가 정해지면 pos 순서로 */
S.chips = {}; S.contact = {};
async function loadChips(tool){
  if(S.chips[tool] && S.chips[tool].length) return S.chips[tool];
  const {data, error} = await sb.from('tool_chips').select('code,ring,idx,pos,hex,name_ko').eq('tool', tool);
  if(error) throw error;
  const ord = c => c.pos ?? c.idx;
  S.chips[tool] = (data||[]).sort((a,b)=> a.ring===b.ring ? ord(a)-ord(b) : (a.ring==='O'?-1:1));
  return S.chips[tool];
}
const chipOf = (tool, code) => ((S.chips[tool]||[]).find(c=>c.code===code));
function chipLabel(tool, code, noMatch, hex){
  if(code){ const c=chipOf(tool, code); const x=hex||(c&&c.hex)||''; return `${x?`<i class="sw" style="background:${h(x)}"></i> `:''}<b>${h(code)}</b>${x?` <span class="small muted">${h(x)}</span>`:''}`; }
  return noMatch ? '맞는 칸 없음' : '—';
}

function stampState(){

  const places = S.places.filter(p=>p.id);

/* ================= 업로드 ================= */
async function uploadBlob(path, blob){
  const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(error && !/exists|Duplicate/i.test(error.message||'')) throw error;
}
/* 사진·키링 자른 사진·미리보기를 함께 올린다. 경로는 {uid}/{기록id}-1.jpg, -1k.jpg(키링), -1s.jpg·-2s.jpg(미리보기), -2.jpg */
function uploadsFor(it, uid, row, ups){
  const put=(col, suffix, blob)=>{ if(!blob) return; row[col]=`${uid}/${it.id}-${suffix}.jpg`; ups.push(uploadBlob(row[col], blob)); };
  put('photo1_path','1',it.p1); put('photo2_path','2',it.p2);
  put('photo1_keyring_path','1k',it.k); put('photo1_preview','1s',it.s1); put('photo2_preview','2s',it.s2);
}
async function processQueue(){
  if(processQueue.running) return; processQueue.running = true;
  try{
    const items = await idb.all();
    for(const it of items){
      try{
        await ensureSession();
        const uid = S.user.id; const row = Object.assign({}, it.row);
        const ups=[];
        uploadsFor(it, uid, row, ups);
        await Promise.all(ups);
        if(it.mode==='edit'){
          const {error} = await sb.from('records').update(row).eq('id', it.id);
          if(error) throw error;
        } else {
          const {error} = await sb.from('records').insert(Object.assign({id: it.id}, row));
          if(error && error.code !== '23505') throw error;
        }
        await idb.del(it.id);
      }catch(e){ console.warn('queue item failed', e); it.lastError = String(e.message||e); await idb.put(it).catch(()=>{}); }
    }
  } finally { processQueue.running = false; }
  await loadMine(); if(sub()==='') render();
}
window.addEventListener('online', ()=>processQueue());

function route(){ return (location.hash||'#/').replace(/^#\/?/, ''); }

const underBase = (r, e) => e.base && (r===e.base.slice(0,-1) || r.startsWith(e.base));
function edOf(r){ return Object.values(ED).find(e=>underBase(r, e)) || ED.ulleung; }
function sub(){ const r=route(); const e=Object.values(ED).find(x=>underBase(r, x)); return e ? r.slice(e.base.length) : r; }

  const land = !about && CUR.mode==='invite' && ((!S.me && r!=='login' && r!=='signup') || r==='home');

  $('main').className = land ? 'land' : about ? 'about' : r.startsWith('admin') ? 'wide' : '';
}

async function render(){

  await useEd(edOf(full));
  topRight();
  const r = sub();
  const v = $('#view');
  if(r.startsWith('about/')){ v.innerHTML = await vAbout(r.slice(6)); return; }
  if(CUR.mode==='public'){
    if(!S.part[CUR.slug]){ v.innerHTML = vJoin(); bindJoin(); return; }
  } else {
    if(r==='home'){ v.innerHTML = vNoInvite(); return; } // 컬러헌터스 랜딩 — 로그인 여부와 상관없이
    const permanent = S.me && !isAnonUser();
    if(r==='login'){ if(permanent){ go(''); return; } v.innerHTML = vLogin(); bindLogin(); return; }
    if(r==='signup'){ if(permanent){ go(''); return; } v.innerHTML = vSignup(); bindSignup(); return; }
    if(!S.me){ v.innerHTML = vNoInvite(); return; }
    if(isAnonUser()){ v.innerHTML = vUpgrade(); bindUpgrade(); return; }
    if(!S.me.consent_at && S.me.role!=='admin'){ v.innerHTML = vConsent(); bindConsent(); return; }

function foldCards(html){
  const t=document.createElement('div'); t.innerHTML=html; const cards=[...t.children].filter(c=>c.classList.contains('card') && c.querySelector('.h3'));
  const open=cards.find(c=>c.querySelector('.h3').textContent.trim()==='이렇게 기록해요')||cards[0];
  const rest=[...t.children].filter(c=>!cards.includes(c)).map(c=>c.outerHTML).join('');   /* 카드가 아닌 알림(곧 열려요 등)은 그대로 */
  return cards.map(c=>{ const h3=c.querySelector('.h3'), title=h3.textContent; h3.remove(); return `<details class="fold" ${c===open?'open':''}><summary>${h(title)}</summary><div class="stack small" style="gap:8px">${c.innerHTML}</div></details>`; }).join('')+rest;
}

async function galPage(key, g, offset){

async function fillGallery(key){
  const box = $('#gallery'); if(!box) return;
  const uid = (S.user && !S.user.is_anonymous) ? S.user.id : '';
  let g = S.gallery[key];
  if(!g || g.uid!==uid || Date.now()-g.at>120000){
    g = S.gallery[key] = {uid, at:Date.now(), scope:'public', total:0, counts:{}, cat:'', view:(g&&g.view)||'photo', list:[], recent:[], busy:false, err:false};
    if(ED[key]){ try{ await galPage(key, g, 0); }catch(e){ g.err = true; g.at = 0; } }
  }
  if(S.gallery[key]===g) drawGallery(key);
}
const galCard = (r,i) => `<button class="gcard" data-g="${i}">
      <div class="gimg">${r.photo?`<img src="${h(r.photo)}" alt="${h(r.name)}" loading="lazy"${focusStyle(r.focus)}>`:`<span>${r.is_memory?'기억 카드':''}</span>`}</div>
      ${colorBand(r.colors, 10)}
      <div class="gtxt"><b>${h(r.name)}</b><span>${h(r.category)}${r.area?' · '+h(r.area):''}</span>${r.status&&r.status!=='approved'?`<span>${tag(r.status)}</span>`:''}</div>
    </button>`;
/* «색만» 타일: 위 64% 내가 본 색, 아래 함께 보인 색 2 */
function galTile(r,i){
  const c=okColors(r.colors), cs=(c&&c.colors)||[];
  return `<button class="ctile" data-g="${i}" aria-label="${h(r.name)}${cs.length?' — '+cs.map(x=>x.hex).join(', '):' — 색 없음'}">
      <span class="cq${cs.length?'':' none'}">${cs.length?[0,1,2].map(k=>`<i style="background:${h((cs[k]||cs[0]).hex)}"></i>`).join(''):'색 없음'}</span>
      <b>${h(r.name)}</b><span class="s">${h(r.area||r.category||'')}</span></button>`;
}
function drawGallery(key){
  const g = S.gallery[key], box = $('#gallery'), root = document.querySelector('.ab'); if(!g || !box || !root || root.dataset.key!==key) return;
  const grp = g.scope==='group', shown = g.cat ? (g.counts[g.cat]||0) : g.total;
  document.querySelectorAll('[data-gtotal]').forEach(el=>el.textContent = g.total ? String(g.total) : '');
  const gn = $('#gnote'); if(gn){ gn.hidden = !grp; gn.textContent = grp ? '수집단 안에서만 보이는 화면이에요. 올리자마자 서로 볼 수 있고, 확인 중인 기록도 함께 보여요. 바깥에는 컬러랩제주가 고른 기록만 나가요.' : ''; }
  /* «소개» 탭 맨 위: 최근 기록 4장 */
  const rc = $('#grecent');
  if(rc){ rc.hidden = !g.recent.length;
    rc.innerHTML = g.recent.length ? `<div class="card stack" style="gap:10px"><div class="row between"><p class="h3">최근 모인 기록</p><a class="small" href="#/about/${h(key)}/records">${g.total}건 모두 보기 →</a></div>
      <div class="rec4">${g.recent.map((r,i)=>`<button data-gr="${i}" aria-label="${h(r.name)}">${r.photo?`<img src="${h(r.photo)}" alt="" loading="lazy"${focusStyle(r.focus)}>`:''}${colorBand(r.colors, 6)}</button>`).join('')}</div></div>` : ''; }
  /* 분류 칩(건수) · 사진|색만 */
  const cats = ED[key] ? ED[key].cats.map(c=>c.v) : [];
  const ch = $('#gchips'); if(ch) ch.innerHTML = g.total ? [`<button type="button" data-gcat="" aria-pressed="${!g.cat}">전체 ${g.total}</button>`].concat(cats.map(v=>`<button type="button" data-gcat="${h(v)}" aria-pressed="${g.cat===v}">${h(v)} ${g.counts[v]||0}</button>`)).join('') : '';
  document.querySelectorAll('[data-gview]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.gview===g.view)));
  const seg = document.querySelector('.ab .seg'); if(seg) seg.hidden = !g.total;
  const more = $('#gmore');
  if(g.err){ box.innerHTML = `<div class="card muted small">기록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>`; if(more) more.innerHTML=''; return; }
  if(!g.total){ if(more) more.innerHTML='';
    box.innerHTML = grp ? `<div class="card stack" style="gap:6px"><p class="small">아직 올라온 기록이 없어요.</p><p class="small muted">수집단이 올린 기록은 올리자마자 이곳에서 함께 볼 수 있어요.</p></div>`
      : `<div class="card stack" style="gap:6px"><p class="small">아직 공개된 기록이 없어요.</p><p class="small muted">참여자가 올린 기록은 컬러랩제주의 확인을 거쳐 이곳에 차례로 쌓입니다.</p></div>`; return; }
  box.innerHTML = g.list.length ? `<div class="gal${g.view==='color'?' colors':''}">${g.list.map(g.view==='color'?galTile:galCard).join('')}</div>` : `<div class="card muted small">이 분류에는 아직 기록이 없어요.</div>`;
  if(more) more.innerHTML = g.list.length<shown ? `<button type="button" class="btn light block" id="gmorebtn" ${g.busy?'disabled':''}>${g.busy?'불러오는 중…':`더 보기 <span class="muted" style="font-weight:400">· ${g.list.length} / ${shown}건</span>`}</button>` : '';
}
document.addEventListener('click', async e=>{
  const root = e.target.closest('.ab'); if(!root) return; const key = root.dataset.key, g = S.gallery[key]; if(!g) return;
  const o = e.target.closest('[data-g]'); if(o){ const r=g.list[+o.dataset.g]; if(r) openRecord(r); return; }
  const rc = e.target.closest('[data-gr]'); if(rc){ const r=g.recent[+rc.dataset.gr]; if(r) openRecord(r); return; }
  const v = e.target.closest('[data-gview]'); if(v){ g.view = v.dataset.gview; drawGallery(key); return; }
  const c = e.target.closest('[data-gcat]'), m = e.target.closest('#gmorebtn');
  if((c || m) && !g.busy){
    if(c){ if(g.cat===c.dataset.gcat) return; g.cat = c.dataset.gcat; g.list = []; }
    g.busy = true; drawGallery(key);
    try{ await galPage(key, g, c ? 0 : g.list.length); g.err=false; }catch(err){ if(c) g.err = true; else toast('더 불러오지 못했어요. 다시 눌러 주세요.'); }
    g.busy = false; if(S.gallery[key]===g) drawGallery(key);
  }
});
function openRecord(r){
  const d = document.createElement('div'); d.className='sheet';
  /* 사진은 원래 비율 그대로(둘레 띠 없이). 휴대폰은 한 단(사진 → 색 → 글), 넓은 화면은 두 단(사진 왼쪽, 글·색 오른쪽) */
  const col=okColors(r.colors), roi=col&&col.roi&&okXY(col.roi) ? col.roi : null, cap=k=>k==='keyring'?'① 키링과 함께':'② 키링 없이';
  let ps=(r.photos&&r.photos.length)?r.photos.slice():(r.photo?[{kind:'scene',url:r.photo}]:[]);
  const roiKind = roi ? (roi.photo===2?'scene':'keyring') : null;
  if(roiKind) ps.sort((x,y)=>(y.kind===roiKind)-(x.kind===roiKind));   /* 색을 뽑은 사진을 먼저 */
  const fig=(p,i)=>`<figure><span class="phw"><img src="${h(p.url)}" alt="${h(r.name)}${ps.length>1?' — '+cap(p.kind):''}" ${i?'loading="lazy"':''}>${p.kind===roiKind?`<span class="roi" data-roi aria-hidden="true" style="left:${(roi.x*100).toFixed(2)}%;top:${(roi.y*100).toFixed(2)}%"></span><span class="roilab" aria-hidden="true" style="left:${(roi.x*100).toFixed(2)}%;top:${(roi.y*100).toFixed(2)}%">색을 뽑은 곳</span>`:''}${ps.length>1?`<span class="phcap">${cap(p.kind)}</span>`:''}</span></figure>`;
  d.innerHTML = `<div class="sheet-in rv" role="dialog" aria-modal="true" aria-label="${h(r.name)}">
    <button class="link" data-close style="align-self:flex-end">닫기 ✕</button>
    <div class="rv-grid${ps.length?'':' nophoto'}">
      ${ps.length?`<div class="rv-ph"><div class="swipe" data-swipe>${ps.map(fig).join('')}</div>
        ${ps.length>1?`<div class="swnav"><button class="btn light" data-sw="-1" aria-label="이전 사진">‹</button><span class="small muted" data-swn>1 / ${ps.length} · 옆으로 넘겨 보세요</span><button class="btn light" data-sw="1" aria-label="다음 사진">›</button></div>`:''}</div>`:''}
      <div class="rv-tx">
        <div class="stack" style="gap:6px"><p class="eyebrow">${h(r.category)}${r.keyring?' · '+h(toolName(r.keyring)):''}</p><h2 class="h2">${h(r.name)}</h2>
          ${r.status&&r.status!=='approved'?`<p class="small">${tag(r.status)} <span class="muted">컬러랩제주가 아직 확인하지 않은 기록이에요.</span></p>`:''}</div>
        ${col&&col.colors.length?`<div class="rv-col">${colorBlock(col)}${roi?'<p class="xs muted">사진 위 점선이 색을 뽑은 곳이에요.</p>':''}</div>`:''}
        <div class="stack" style="gap:6px">
          ${r.usage?`<p><b>${h(usageQ(CUR, r.category).label)}</b> ${h(r.usage)}</p>`:''}
          ${r.story?`<p style="white-space:pre-wrap">${h(r.story)}</p>`:''}
          ${(r.tod||r.time_note)?`<p><b>찍은 때</b> ${h([r.tod, r.time_note].filter(Boolean).join(' · '))}</p>`:''}
          <p class="small muted">${[r.area, r.by?`기록 ${r.by}`:'', fmt(r.at)].filter(Boolean).map(h).join(' · ')}</p></div>
      </div>
    </div></div>`;
  /* 점선 원은 사진의 짧은 변을 기준으로 한 크기라, 사진이 뜬 뒤에 폭을 정한다 */
  d.querySelectorAll('[data-roi]').forEach(el=>{ const im=el.parentElement.querySelector('img'); const fit=()=>{ if(im.naturalWidth) el.style.width=(2*(roi.r||COLORS.roi)*Math.min(im.naturalWidth,im.naturalHeight)/im.naturalWidth*100).toFixed(2)+'%'; }; im.complete?fit():im.addEventListener('load', fit); });
  const close = ()=>{ d.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e=>{ if(e.key==='Escape') close(); };
  d.addEventListener('click', e=>{ if(e.target===d || e.target.closest('[data-close]')) close(); });
  const sw=d.querySelector('[data-swipe]');
  if(sw && sw.children.length>1){ const n=sw.children.length, lab=d.querySelector('[data-swn]');
    const at=()=>Math.round(sw.scrollLeft/sw.clientWidth);
    sw.addEventListener('scroll', ()=>{ lab.textContent=`${Math.min(n,at()+1)} / ${n}`; }, {passive:true});
    d.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>sw.scrollTo({left:(Math.max(0,Math.min(n-1,at()+(+b.dataset.sw))))*sw.clientWidth, behavior:'smooth'})); }
  document.addEventListener('keydown', onKey);
  document.body.appendChild(d);
  /* 넓은 화면: 사진을 왼쪽 단 폭과 화면 높이의 80% 안에서 원래 비율로 가장 크게 (작은 미리보기도 같은 크기로) */
  const sizePh=()=>{ const wide=matchMedia('(min-width:700px)').matches, box=d.querySelector('.rv-ph');
    d.querySelectorAll('.phw').forEach(w=>{ const im=w.querySelector('img'); if(!wide || !box || !im.naturalWidth){ w.style.width=''; return; }
      w.style.width=Math.floor(im.naturalWidth*Math.min(box.clientWidth/im.naturalWidth, innerHeight*0.8/im.naturalHeight))+'px'; }); };
  d.querySelectorAll('.phw img').forEach(im=>im.complete?0:im.addEventListener('load', sizePh)); sizePh();
  const onRs=()=>{ if(d.isConnected) sizePh(); else removeEventListener('resize', onRs); }; addEventListener('resize', onRs);
}

function vConsent(){
  return `<div class="stack" style="gap:14px">
    <div class="stack" style="gap:4px"><p class="eyebrow">처음 한 번만</p><h1 class="h1">${h(S.me.nickname||'')}님, 반갑습니다</h1>
    <p>기록을 시작하기 전에 세 가지를 확인해 주세요.</p></div>
    <label class="check"><input type="checkbox" id="c1"><span><b>사진과 이야기의 이용</b><br><span class="small muted">찍은 사진의 저작권은 나에게 있고, 「색채기반 울릉자원도감」·지도·연구·전시에 쓰는 것을 허락합니다. 도감에는 기여자로 이름(별칭)이 실립니다. 울릉 주민과 사업자는 지역 상품과 안내물에 무료로 쓸 수 있고, 울릉 밖 업체의 상업적 이용은 별도 협의와 내 동의를 거칩니다.</span></span></label>
    <label class="check"><input type="checkbox" id="c2"><span><b>개인정보</b><br><span class="small muted">이름과 연락처는 활동비 지급과 연락에만 쓰고, 공개할 때는 별칭만 씁니다.</span></span></label>
    <label class="check"><input type="checkbox" id="c3"><span><b>위치 정보</b><br><span class="small muted">기록한 장소를 남깁니다. 나물 나는 곳·텃밭·사유지는 공개 지도에서 정확한 위치를 흐리게 표시합니다.</span></span></label>
    <p class="small muted">빼고 싶은 기록은 언제든 비공개로 바꿀 수 있습니다.</p>
    <button class="btn main block" id="agree" disabled>모두 동의하고 시작하기</button>
  </div>`;
}
function bindConsent(){
  const boxes=['#c1','#c2','#c3'].map(s=>$(s)); const b=$('#agree');
  boxes.forEach(x=>x.addEventListener('change',()=>{ b.disabled=!boxes.every(y=>y.checked); }));
  b.addEventListener('click', async ()=>{
    b.disabled=true;
    const {error} = await sb.rpc('record_consent', {p_version: CONSENT_VERSION});
    if(error){ toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); b.disabled=false; return; }
    S.me.consent_at = new Date().toISOString(); localStorage.setItem('ch_me', JSON.stringify(S.me));
    render();
  });
}

    <div class="actionbar"><button class="btn main block" id="join" disabled>참여하고 기록 시작</button></div>
  </div>`;

function bindJoin(){
  const n=$('#jnick'), boxes=['#j1','#j2','#j3'].map(x=>$(x)), b=$('#join');
  const upd=()=>{ b.disabled = !n.value.trim() || !boxes.every(x=>x.checked); };
  n.addEventListener('input', upd); boxes.forEach(x=>x.addEventListener('change', upd));
  b.addEventListener('click', async ()=>{
    b.disabled=true; b.innerHTML='<span class="spinner"></span> 준비하는 중…';
    try{
      await ensureSession();
      const {data, error} = await sb.rpc('join_edition', {p_edition:CUR.slug, p_nickname:n.value.trim(), p_version:CUR.consentVer||''});
      if(error) throw error;
      S.part[CUR.slug] = data;
      await loadMine().catch(()=>{});
      S.draft = newDraft(); go('new');
    }catch(e){
      console.warn(e); b.disabled=false; b.textContent='참여하고 기록 시작';
      toast('참여하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.', 3500);
    }
  });
}

function counts(){
  const c={total:S.records.length, approved:0, pending:0, held:0, rejected:0};
  S.records.forEach(r=>{ c[r.status]=(c[r.status]||0)+1; });
  return c;
}

});

/* ---------- 장소 스탬프 · 추첨 응모 ---------- */
const rewardShort = t => (t||'').replace(/^\d+곳 달성자 중 /,'') || '경품 추첨';
function vStamps(){
  const st = stampState(); if(!st.places.length) return '';
  const reward = rewardShort((S.edition&&S.edition.reward)||'');
  const c = S.contact[CUR.slug];
  let tail = '';
  if(c) tail = `<div class="ok small">추첨 응모를 마쳤어요 (${fmt(c.consent_at)}). 당첨되면 남겨 주신 연락처로 알려 드려요.</div>`;
  else if(st.done >= st.need) tail = `<div class="stack" style="gap:10px;border-top:1px solid var(--line);padding-top:12px">
      <p><b>${st.need}곳 달성!</b> ${h(reward)}에 응모할 수 있어요.</p>
      <div class="field"><label for="ctname">이름</label><input id="ctname" class="input" maxlength="30" autocomplete="name"></div>
      <div class="field"><label for="ctphone">휴대폰 번호</label><input id="ctphone" class="input" inputmode="tel" maxlength="13" placeholder="010-0000-0000" autocomplete="tel"></div>
      <label class="check"><input type="checkbox" id="ctok"><span><b>개인정보 수집·이용 동의</b><br><span class="small muted">이름과 휴대폰 번호는 추첨과 경품 안내에만 쓰고, 미션이 끝나고 경품 발송을 마치면 지웁니다. 공개 기록에는 별칭만 나옵니다.</span></span></label>
      <p class="xs muted">기록이 확인 과정에서 반려되면 그 장소의 스탬프는 빠지고, 추첨은 인정된 기록 기준으로 합니다.</p>
      <button class="btn main block" id="ctsend" disabled>추첨 응모하기</button></div>`;
  else tail = `<p class="small muted">${st.need-st.done}곳 더 기록하면 ${h(reward)}에 응모할 수 있어요.</p>`;
  return `<div class="card stack" style="gap:12px">
    <div class="row between"><p class="h3">장소 스탬프</p><b>${st.done} / ${st.need}곳</b></div>
    <div class="stamps">${st.places.map(p=>`<div class="stamp ${st.ids.has(p.id)?'on':''}"><i>${st.ids.has(p.id)?'✓':''}</i>${h(p.name)}</div>`).join('')}</div>
    ${tail}</div>`;
}

/* ---------- 내 기록 (모아 보기 · 고치기 · 지우기) ---------- */
/* 지우기는 확인 중인 기록만 (DB 규칙). 인정·보완 요청·반려 기록은 지울 수 없다 */
const canDelete = r => r && r.status==='pending';
const delWhy = r => r.status==='approved' ? '인정된 기록은 지울 수 없어요. 감추려면 열어서 공개를 꺼 주세요.' : r.status==='held' ? '보완 요청을 받은 기록은 고쳐서 다시 내 주세요.' : r.status==='rejected' ? '반려된 기록은 고치거나 지울 수 없어요.' : '';
function vMine(){
  const list=S.records;
  return `<a class="link" href="#/about/${CUR.about}">← 모인 기록 둘러보기</a>

      ${colorBand(r.colors, 10)}
      <div class="gtxt"><b>${h(r.local_name||r.color_name)}</b><span>${h(r.category)}${(r.area||r.place_name)?' · '+h(r.area||r.place_name):''} · ${fmt(r.created_at)}</span><span>${tag(r.status)}${r.share?'':' <span class="tag">비공개</span>'}</span></div>
      <div class="gacts">${r.status==='rejected'?'':`<button class="btn light" data-medit="${h(r.id)}">고치기</button>`}${canDelete(r)?`<button class="btn light" data-mdel="${h(r.id)}" style="color:var(--bad-ink)">지우기</button>`:''}${delWhy(r)?`<span class="small muted">${delWhy(r)}</span>`:''}</div>
    </div>`).join('')}</div>` : `<div class="card muted">아직 올린 기록이 없어요.</div>`}
  <a class="btn main block" href="${homeHref()}new" id="mnew">＋ 기록 남기기</a>`;
}
async function deleteRecord(id){
  const r=S.records.find(x=>x.id===id); if(!r || !canDelete(r)) return false;
  if(!confirm(`«${r.local_name||r.color_name}» 기록을 지울까요?\n사진과 글이 모두 지워지고 되돌릴 수 없어요.`)) return false;
  const {data, error}=await sb.from('records').delete().eq('id', id).eq('status','pending').select('id');
  if(error || !data || !data.length){ toast('지우지 못했어요. 이미 확인이 끝난 기록일 수 있어요. 새로고침해 주세요.'); return false; }
  const paths=[r.photo1_path, r.photo1_preview, r.photo1_keyring_path, r.photo2_path, r.photo2_preview].filter(Boolean);
  if(paths.length) await sb.storage.from(BUCKET).remove(paths).catch(()=>{});
  S.records=S.records.filter(x=>x.id!==id); delete S.thumbs[id]; delete S.gallery[CUR.slug];
  toast('기록을 지웠어요'); return true;
}
document.addEventListener('click', async e=>{
  const ed=e.target.closest('[data-medit]');
  if(ed){ const r=S.records.find(x=>x.id===ed.dataset.medit); if(!r) return;
    if(r.status==='held'){ S.draft=draftFrom(r); go('edit/'+r.id); } else { S.openEdit=r.id; S.tedit=null; go('rec/'+r.id); } return; }
  const dl=e.target.closest('[data-mdel]');
  if(dl){ dl.disabled=true; const ok=await deleteRecord(dl.dataset.mdel); if(ok && sub()==='mine') render(); else dl.disabled=false; return; }
  if(e.target.id==='rdel'){ const id=sub().slice(4); e.target.disabled=true; if(await deleteRecord(id)) go('mine'); else e.target.disabled=false; }
});
function vRecord(id){
  const r=S.records.find(x=>x.id===id); if(!r) return `<div class="card">기록을 찾을 수 없어요. <a href="${homeHref()}">돌아가기</a></div>`;
  setTimeout(async ()=>{ for(const k of ['photo1_path','photo2_path']){ if(!r[k]) continue; const {data}=await sb.storage.from(BUCKET).createSignedUrl(r[k],3600); const el=document.querySelector(`[data-ph="${k}"]`); if(el&&data) el.innerHTML=`<img src="${h(data.signedUrl)}" alt="">`; } },0);
  return `<button class="link" onclick="history.back()">← 내 기록</button>
  <div class="card stack">
    <div class="row between"><h1 class="h2">${h(r.local_name||r.color_name)}</h1>${tag(r.status)}</div>
    ${r.status==='held'?`<div class="notice">보완 요청: ${h(r.review_memo||'')} ${h((r.review_reasons||[]).join(', '))}</div>`:''}
    ${r.is_memory?'<p class="tag">기억 카드</p>':(r.photo1_path&&r.photo2_path?`<div class="rings" style="grid-template-columns:1fr 1fr"><div class="shot" data-ph="photo1_path"><span class="badge">① 키링과 함께</span></div><div class="shot" data-ph="photo2_path"><span class="badge">② 키링 없이</span></div></div>`:r.photo1_path?`<div class="shot" data-ph="photo1_path"><span class="badge">① 키링과 함께</span></div>`:`<div class="shot" data-ph="photo2_path"><span class="badge">사진</span></div>`)}
    ${colorBlock(r.colors)}
    <dl><dt>분류</dt><dd>${h(r.category)}</dd><dt>${CUR.tools?TOOL_WORD:'키링'}</dt><dd>${h(toolName(r.keyring)||'없음')}</dd>${r.tool?`<dt>고른 칸</dt><dd>${chipLabel(r.tool, r.chip_code, r.no_match, r.chip_hex)}</dd>`:''}<dt>${h(CUR.placeLabel)}</dt><dd>${h(r.area||r.place_name||'—')}</dd>${(CUR.usage||r.usage)?`<dt>${h(usageQ(CUR,r.category).label)}</dt><dd>${h(r.usage||'—')}</dd>`:''}<dt>이야기</dt><dd>${h(r.story||'—')}</dd><dt>찍은 때</dt><dd>${h([r.taken_src==='unknown'?'시각 모름':timeUnsure(r)&&CUR.conditions?'':(fmtWhen(r.taken_src?r.taken_at:(r.photo1_taken_at||r.taken_at||r.created_at))), whenLine(r), r.weather].filter(Boolean).join(' · ')||'—')}${timeUnsure(r)&&CUR.conditions&&canEditFields(r)?' <span class="xs muted">사진에 찍은 시각이 없어요. «고치기»에서 알려 주세요.</span>':''}</dd>${r.text_edited_at?`<dt>글 고친 때</dt><dd>${fmt(r.text_edited_at)}</dd>`:''}</dl>
    ${canEditText(r)?(S.textEdit===r.id?vTextForm(r):`<button class="btn light block" id="tedit">✎ ${canEditFields(r)?'고치기 (이름·분류·동네·이야기)':CUR.usage?'이름·쓰임·이야기 고치기':'색 이름·이야기 고치기'}</button>`):''}
    <label class="check"><input type="checkbox" id="share" ${r.share?'checked':''}><span><b>${CUR.mode==='invite'?'수집단과 함께 보고, 골라서 도감·지도에 실어도 좋아요':'도감·지도에 실어도 좋아요'}</b><br><span class="small muted">${CUR.mode==='invite'?'끄면 이 기록은 나와 컬러랩제주만 봐요.':'끄면 이 기록은 공개하지 않아요.'}</span></span></label>
    ${canDelete(r)?`<button class="btn light block" id="rdel" style="color:var(--bad-ink)">이 기록 지우기</button>`:''}
  </div>`;
}
/* ---------- 이름(제목)·쓰임·이야기 고치기 ---------- */
const canEditText = r => r && r.status!=='rejected' && r.status!=='held';
/* 확인 중·인정 기록: 현장에서 빨리 올리고 나중에 컴퓨터로 분류·동네·찍은 때·날씨까지 고친다 (울릉) */
const canEditFields = r => canEditText(r) && CUR.conditions && !r.is_memory;
function teditState(r){
  if(!S.tedit || S.tedit.id!==r.id){ const known=S.places.some(p=>p.name===r.area); S.tedit={id:r.id, cat:r.category, area:r.area||'', areaOther:!!r.area&&!known, when:whenFrom(r), wx:r.weather||''}; }
  return S.tedit;
}
function vEditFields(r){
  const t=teditState(r);
  const cats=CUR.cats.map(c=>c.v).filter(v=>v!=='기억 카드');
  const other=t.areaOther || (!!t.area && !S.places.some(p=>p.name===t.area));
  return `<div class="field"><label for="ecat">분류</label><select id="ecat" class="input">${cats.map(v=>`<option value="${h(v)}" ${v===t.cat?'selected':''}>${h(v)}</option>`).join('')}</select>
      ${CUR.catHint?`<span class="hint">${h(CUR.catHint)}</span>`:''}</div>
    <div class="field"><label for="earea">${h(CUR.placeLabel)}</label><select id="earea" class="input">${S.places.map(p=>`<option value="${h(p.name)}" ${!other&&t.area===p.name?'selected':''}>${h(p.name)}</option>`).join('')}<option value="${OTHER_AREA}" ${other?'selected':''}>기타 (직접 적기)</option></select>
      ${other?`<input id="eareatxt" class="input" maxlength="30" style="margin-top:8px" value="${h(t.area)}" placeholder="예: 내수전 약수터" aria-label="어디인가요?">`:''}</div>
    ${vWhen(t.when, r.lat, r.lng)}
    <div class="field"><span class="label" style="font-weight:600">날씨</span><div style="display:flex;flex-wrap:wrap;gap:8px">${WEATHERS.map(x=>`<button type="button" class="chip" data-ewx="${h(x)}" aria-pressed="${t.wx===x}">${h(x)}</button>`).join('')}</div></div>`;
}
function vTextForm(r){
  const t=canEditFields(r)?teditState(r):null; const qcat=t?t.cat:r.category;
  return `<div class="card stack" style="gap:12px;background:var(--paper,#F4F6F7)">
    <p class="h3">${canEditFields(r)?'고치기':CUR.usage?'이름·쓰임·이야기 고치기':'색 이름·이야기 고치기'}</p>
    ${canEditFields(r)?'<p class="small muted">현장에서는 빨리 올리고, 글과 분류는 컴퓨터로 차분히 고쳐도 돼요.</p>':''}
    <div class="field"><label for="ln2">${h(CUR.nameLabel)} <span style="color:var(--bad-ink)">*</span></label><input id="ln2" class="input" maxlength="40" value="${h(t&&t.ln!=null?t.ln:(r.local_name||r.color_name||''))}"></div>
    ${canEditFields(r)?vEditFields(r):''}
    ${CUR.usage&&!r.is_memory?`<div class="field"><label for="us2" id="us2label">${h(usageQ(CUR,qcat).q)}</label><input id="us2" class="input" maxlength="500" value="${h(t&&t.us!=null?t.us:(r.usage||''))}" placeholder="${h(usageQ(CUR,qcat).ph)}"></div>`:''}
    <div class="field"><label for="sto2">들려줄 이야기 ${r.is_memory?'<span style="color:var(--bad-ink)">*</span>':''}</label><textarea id="sto2" class="input" maxlength="1000">${h(t&&t.st!=null?t.st:(r.story||''))}</textarea>
      <span class="hint">🎤 키보드의 마이크 버튼을 누르고 말하면 글로 바뀌어요.</span></div>
    ${r.status==='approved'?'<p class="xs muted">이미 인정된 기록이에요. 고친 내용은 공개 기록에 바로 반영되고, 컬러랩제주가 한 번 더 살펴봐요.</p>':''}
    <div class="rings" style="grid-template-columns:1fr 1fr"><button class="btn light" id="tcancel">취소</button><button class="btn main" id="tsave">저장하기</button></div>
  </div>`;
}
async function saveText(id){
  const r=S.records.find(x=>x.id===id); if(!r) return;
  const ln=$('#ln2').value.trim(), us=$('#us2')?$('#us2').value.trim():(r.usage||''), st=$('#sto2').value.trim();
  if(!ln){ toast(CUR.nameLabel+'을 적어 주세요'); $('#ln2').focus(); return; }
  if(r.is_memory && !st){ toast('기억 카드는 이야기가 꼭 필요해요'); $('#sto2').focus(); return; }
  const b=$('#tsave'); b.disabled=true; b.innerHTML='<span class="spinner"></span> 저장 중…';
  const upd={local_name:ln, color_name:ln.slice(0,30), usage:us, story:st};
  if(canEditFields(r) && S.tedit && S.tedit.id===id){
    const t=S.tedit; if(!t.area){ toast(CUR.placeLabel+'을 적어 주세요'); return; }
    Object.assign(upd, {category:t.cat, area:t.area, place_id:(S.places.find(p=>p.name===t.area)||{}).id||'', weather:t.wx||'', time_note:(t.when.note||'').trim().slice(0,40)||null});
    /* 찍은 시각은 손댔을 때만 보낸다 — 예전 기록의 저장값을 그대로 두기 위해 */
    const w=t.when;
    if(w.dirty){
      if(w.src==='unknown') Object.assign(upd, {taken_at:null, taken_src:'unknown', sun_elev:null, light:''});
      else if(w.taken){ const sp=sunOf(w.taken, r.lat, r.lng); Object.assign(upd, {taken_at:w.taken, taken_src:'person', sun_elev:sp.elev, light:sunLabel(sp)}); }

function sunPos(iso, lat, lng){
  const t=new Date(iso); if(!iso || isNaN(t) || lat==null || lng==null) return null;
  const rad=Math.PI/180, y=t.getUTCFullYear(), leap=(y%4===0&&y%100!==0)||y%400===0;
  const doy=Math.floor((Date.UTC(y,t.getUTCMonth(),t.getUTCDate())-Date.UTC(y,0,0))/864e5);
  const hr=t.getUTCHours()+t.getUTCMinutes()/60+t.getUTCSeconds()/3600;
  const g=2*Math.PI/(leap?366:365)*(doy-1+(hr-12)/24);

}
/* 이름표: 밤(<-6°) / 새벽(-6~0°) / 아침(0~15°) / 오전(15° 이상, 남중 1시간 전까지) / 한낮(남중 ±1시간) / 오후 / 해 질 녘(오후 15° 아래 ~ -6°) */

    const mark = (pt, kind) => pt ? `<span aria-hidden="true" style="position:absolute;left:${(pt.x*100).toFixed(2)}%;top:${(pt.y*100).toFixed(2)}%;transform:translate(-50%,-50%);width:${kind==='k'?44:28}px;height:${kind==='k'?44:28}px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px ${kind==='k'?'#224653':'#A6503F'};${kind==='t'?'background:rgba(166,80,63,.35);':''}pointer-events:none"></span><span style="position:absolute;left:${(pt.x*100).toFixed(2)}%;top:calc(${(pt.y*100).toFixed(2)}% + ${kind==='k'?28:20}px);transform:translateX(-50%);background:${kind==='k'?'#224653':'#A6503F'};color:#fff;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;pointer-events:none">${kind==='k'?h(tl):'대상'}</span>` : '';
    const isFrame = d.keyring==='컬러프레임';
    body=`<h1 class="h2">① ${h(jo(tl,'을','를'))} 대고 한 장</h1>
      ${why}
      ${d.p1&&CUR.taps?`<div class="notice small" id="tapmsg" style="margin:0">${tapMsg}</div>
      <div id="tapwrap" style="position:relative;border-radius:14px;overflow:hidden;cursor:crosshair;touch-action:manipulation"><img src="${h(d.p1.url)}" alt="${h(jo(tl,'과','와'))} 함께 찍은 사진 — 눌러서 ${h(jo(tl,'과','와'))} 대상을 짚어요" style="display:block;width:100%;height:auto" draggable="false">${d.p1.txy?roiMarks(d.p1.txy, d.p1.ow, d.p1.oh):''}${mark(d.p1.kxy,'k')}${mark(d.p1.txy,'t')}<span class="badge" style="position:absolute;left:10px;top:10px;background:rgba(34,70,83,.88);color:#fff;border-radius:8px;padding:2px 10px;font-size:14px;font-weight:700">① ${h(jo(tl,'과','와'))} 함께</span></div>
      ${d.p1.kxy?'<button class="link" id="retap" style="align-self:flex-start">다시 짚기</button>':''}
      ${vColorPick(d.p1, 1)}`
      :`<div class="shot">${d.p1?`<img src="${h(d.p1.url)}" alt="${h(jo(tl,'과','와'))} 함께 찍은 사진"><span class="badge">① ${h(jo(tl,'과','와'))} 함께</span>`:d.oldP1?'<span class="muted small">이미 올린 사진이 있어요 (바꾸려면 다시 찍기)</span>':'<span class="muted">아직 사진이 없어요</span>'}</div>`}
      ${sizeNote(d.p1)}
      <div class="rings" style="grid-template-columns:1fr 1fr"><button class="btn dark" data-pick="1" data-cap="1">카메라로 찍기</button><button class="btn light" data-pick="1" data-cap="0">앨범에서 선택</button></div>
      <div class="card"><ul class="tips">${isFrame
        ? `<li>프레임 <b>창 안에 대상</b>이 보이게, 흰 테두리가 다 나오게</li><li>프레임과 대상이 <b>같은 빛</b>을 받게 (반은 그늘, 반은 햇빛 ✕)</li><li>흰 테두리에 그림자가 지지 않게</li><li>플래시·필터는 끄고</li>`
        : `<li>${h(jo(tl,'을','를'))} 대상 <b>바로 옆, 같은 높이</b>에</li><li>${h(jo(tl,'과','와'))} 대상이 <b>같은 빛</b>을 받게 (반은 그늘, 반은 햇빛 ✕)</li><li>${h(jo(tl,'이','가'))} 화면의 5분의 1 이상 보이게</li><li>손가락이 색 조각을 가리지 않게</li><li>플래시·필터는 끄고</li>`}</ul></div>`;
    foot=`<button class="btn main block" id="next" ${p1Ready(d)?'':'disabled'}>다음</button>`;
  } else if(k==='p2'){
    const gap = (d.p1&&d.p2&&d.p1.exif.taken&&d.p2.exif.taken) ? Math.abs(new Date(d.p1.exif.taken)-new Date(d.p2.exif.taken))/60000 : null;
    body= noRing(d)
      ? `<h1 class="h2">사진 한 장</h1><p class="muted small">오늘 본 색이 잘 보이게 찍어요. 플래시·필터·보정 기능은 끄고, 해를 정면으로 마주 보지 않게.</p>`
      : `<h1 class="h2">② ${h(toolShort(d))}만 빼고 한 장</h1><p class="muted small">같은 자리, 같은 빛에서 바로 이어서 찍어요. ${CUR.mode==='public'?'오늘 본 색이 잘 보이게.':'자원의 모양이 잘 보이게 가까이.'}</p>`;
    body+= (noRing(d) && d.p2) ? `
      <div class="notice small" style="margin:0">${d.p2.txy?'잘 짚었어요. 다시 하려면 «다시 짚기»':'사진에서 <b>기록할 대상</b>을 한 번 눌러 주세요'}</div>
      <div id="tapwrap2" style="position:relative;border-radius:14px;overflow:hidden;cursor:crosshair;touch-action:manipulation"><img src="${h(d.p2.url)}" alt="찍은 사진 — 눌러서 대상을 짚어요" style="display:block;width:100%;height:auto" draggable="false">${d.p2.txy?roiMarks(d.p2.txy, d.p2.ow, d.p2.oh)+`<span aria-hidden="true" style="position:absolute;left:${(d.p2.txy.x*100).toFixed(2)}%;top:${(d.p2.txy.y*100).toFixed(2)}%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #A6503F;background:rgba(166,80,63,.35);pointer-events:none"></span>`:''}</div>
      ${d.p2.txy?'<button class="link" id="retap2" style="align-self:flex-start">다시 짚기</button>':''}
      ${vColorPick(d.p2, 2)}` : `
      <div class="shot">${d.p2?`<img src="${h(d.p2.url)}" alt="${h(toolShort(d))} 없이 찍은 사진"><span class="badge">② ${h(toolShort(d))} 없이</span>`:(d.oldP2?'<span class="muted small">이미 올린 사진이 있어요</span>':'<span class="muted">아직 사진이 없어요</span>')}</div>`;
    body+=`
      ${sizeNote(d.p2)}
      <div class="rings" style="grid-template-columns:1fr 1fr"><button class="btn dark" data-pick="2" data-cap="1">카메라로 찍기</button><button class="btn light" data-pick="2" data-cap="0">앨범에서 선택</button></div>
      ${gap!=null && gap>GAP_WARN_MIN?`<div class="notice">두 사진을 찍은 시간이 <b>${Math.round(gap)}분</b> 차이 나요. 빛이 바뀌었을 수 있으니, 가능하면 같은 자리에서 다시 이어서 찍어 주세요.</div>`:''}`;
    foot = (CUR.chips && !(S.edition&&S.edition.photo2_required))
      ? `<div class="rings" style="grid-template-columns:1fr 2fr"><button class="btn light" id="skip">건너뛰기</button><button class="btn main" id="next" ${(d.p2||d.oldP2)?'':'disabled'}>다음</button></div>`
      : `<button class="btn main block" id="next" ${(d.p2 ? (!noRing(d) || !!d.p2.txy) : !!d.oldP2)?'':'disabled'}>다음</button>`;
  } else if(k==='chip'){
    const cs=S.chips[CUR.tool]||[];
    if(!cs.length && !vDraft.chipTry){ vDraft.chipTry=true; loadChips(CUR.tool).then(l=>{ if(l.length && S.draft===d) render(); }).catch(()=>{}).finally(()=>{ vDraft.chipTry=false; }); }
    const grid=ring=>cs.filter(c=>c.ring===ring).map(c=>`<button class="cell" data-chip="${h(c.code)}" aria-pressed="${d.chip===c.code}" aria-label="${h(c.code)} 칸"><i style="background:${h(c.hex)}"></i><span>${h(c.code)}</span></button>`).join('');
    body=`<h1 class="h2">가장 가까운 칸 고르기</h1>
      <p class="muted small">사진이 아니라 <b>실제 대상과 키링을 눈으로 견주어</b> 가장 비슷한 칸을 골라요. 화면 색은 휴대폰마다 조금 달라요 — 칸 번호를 키링에서 확인해 주세요.</p>
      ${d.p1?`<div class="shot" style="aspect-ratio:auto;max-height:34vh"><img src="${h(d.p1.url)}" alt="키링과 함께 찍은 사진" style="object-fit:contain;max-height:34vh"><span class="badge">①</span></div>`:''}
      ${cs.length?`<p class="small"><b>바깥 링</b> <span class="muted">(${cs.filter(c=>c.ring==='O').length}칸)</span></p><div class="chips">${grid('O')}</div>
      <p class="small"><b>안쪽 링</b> <span class="muted">(${cs.filter(c=>c.ring==='I').length}칸)</span></p><div class="chips">${grid('I')}</div>`
        :'<div class="notice small">키링 칸을 불러오지 못했어요. 인터넷이 잡히면 다시 열어 주세요. «맞는 칸이 없어요»로 넘어가도 됩니다.</div>'}
      <button class="choice" id="nomatch" aria-pressed="${d.noMatch}"><b>맞는 칸이 없어요</b><span>키링에 비슷한 색이 없을 때 — 이것도 소중한 기록이에요</span></button>`;
    foot=`<button class="btn main block" id="next" ${(d.chip||d.noMatch)?'':'disabled'}>다음</button>`;
  } else if(k==='where'){
    const opts=S.places.map(p=>`<option value="${h(p.name)}" ${d.area===p.name?'selected':''}>${h(p.name)}</option>`).join('');
    const other=areaIsOther(d);
    /* 찍은 때: 사진에 담긴 시각이 있으면 그대로(손으로 고친 값은 지킨다), 없으면 묻는다 */
    if(CUR.conditions && !isMemory(d)){ const w=d.when, iso=(d.p1&&d.p1.exif.taken)||(d.p2&&d.p2.exif.taken);
      if(iso){ if(w.src!=='person' && w.src!=='unknown'){ w.taken=iso; w.src='exif'; } }
      else if((d.p1||d.p2) && w.src==='exif'){ w.taken=null; w.src=''; } }
    const conds = (CUR.conditions && !isMemory(d)) ? `
      ${vWhen(d.when, d.lat, d.lng)}
      <div class="field"><span class="label" style="font-weight:600">날씨</span><div style="display:flex;flex-wrap:wrap;gap:8px">${WEATHERS.map(w=>`<button type="button" class="chip" data-wx="${h(w)}" aria-pressed="${d.weather===w}">${h(w)}</button>`).join('')}</div></div>` : '';
    body=`<h1 class="h2">${conds?'어디서, 언제 찍었나요?':'어디에서 찍었나요?'}</h1>
      ${CUR.stamps?'<p class="small muted">참여 장소에서 찍었다면 그 장소를 골라 주세요. 장소마다 스탬프가 하나씩 찍혀요.</p>':''}
      <div class="field"><label for="area">${h(CUR.placeLabel)}</label><select id="area" class="input"><option value="">${h(CUR.placeLabel)} 고르기</option>${opts}<option value="${OTHER_AREA}" ${other?'selected':''}>기타 (직접 적기)</option></select></div>
      ${other?`<div class="field"><label for="areatxt">어디인가요? <span style="color:var(--bad-ink)">*</span></label><input id="areatxt" class="input" maxlength="30" value="${h(d.area)}" placeholder="예: 내수전 약수터, 성인봉 가는 길"><span class="hint">목록에 없는 곳은 여기에 적어 주세요. 알려 주시면 목록에 넣을게요.</span></div>`:''}
      ${conds}
      <div class="stack"><div class="row between"><b>지도 위치</b><button class="btn light sm" id="gps">지금 위치 쓰기</button></div>
      <p class="small muted" id="locmsg">${locMsg(d)}</p>
      <div class="map" id="map"></div>
      <p class="xs muted">지도를 눌러 핀을 옮길 수 있어요. 인터넷이 약해 지도가 안 보이면 ${h(CUR.placeLabel)}만 골라도 됩니다.</p></div>`;
    foot=`<button class="btn main block" id="next" ${whereOk(d)?'':'disabled'}>다음</button>`;
  } else if(k==='words'){
    const uq=usageQ(CUR, d.category);
    body=`<h1 class="h2">${h(CUR.wordsTitle)}</h1>
      <div class="field"><label for="ln">${h(CUR.nameQ)} <span style="color:var(--bad-ink)">*</span></label><input id="ln" class="input" maxlength="40" value="${h(d.local_name)}" placeholder="${h(CUR.namePh)}">${CUR.nameHint?`<span class="hint">${h(CUR.nameHint)}</span>`:''}</div>
      ${CUR.usage&&!isMemory(d)?`<div class="field"><label for="us">${h(uq.q)}</label><input id="us" class="input" maxlength="500" value="${h(d.usage)}" placeholder="${h(uq.ph)}"></div>`:''}
      <div class="field"><label for="sto">들려줄 이야기 ${isMemory(d)?'<span style="color:var(--bad-ink)">*</span>':''}</label><textarea id="sto" class="input" maxlength="1000" placeholder="${h(isMemory(d)?CUR.storyPh:uq.story)}">${h(d.story)}</textarea>
      <span class="hint">🎤 키보드의 마이크 버튼을 누르고 말하면 글로 바뀌어요.</span></div>`;
    foot=`<button class="btn main block" id="next" ${wordsOk(d)?'':'disabled'}>다음</button>`;
  } else if(k==='check'){
    body=`<h1 class="h2">이렇게 올릴게요</h1>
      ${isMemory(d)?'':noRing(d)?`<div class="shot">${d.p2?`<img src="${h(d.p2.url)}" alt="">`:'<span class="small muted">이전 사진</span>'}</div>`:`<div class="rings" style="grid-template-columns:1fr 1fr"><div class="shot">${d.p1?`<img src="${h(d.p1.url)}" alt="">`:'<span class="small muted">이전 사진</span>'}<span class="badge">①</span></div><div class="shot">${d.p2?`<img src="${h(d.p2.url)}" alt="">`:`<span class="small muted">${d.oldP2?'이전 사진':'건너뜀'}</span>`}<span class="badge">②</span></div></div>`}
      <div class="card"><dl><dt>분류</dt><dd>${h(d.category)}</dd>${!isMemory(d)?`<dt>${CUR.tools?TOOL_WORD:'키링'}</dt><dd>${h(noRing(d)?'없음 (사진 한 장)':toolName(d.keyring))}</dd>`:''}${CUR.chips&&!d.p2&&!d.oldP2?`<dt>② 사진</dt><dd>건너뜀</dd>`:''}${CUR.chips?`<dt>고른 칸</dt><dd>${chipLabel(CUR.tool, d.chip, d.noMatch)}</dd>`:''}<dt>${h(CUR.placeLabel)}</dt><dd>${h(d.area)}${d.lat?' · 지도 위치 있음':''}</dd>${CUR.conditions&&!isMemory(d)?`<dt>찍은 때</dt><dd>${h([d.when.src==='unknown'?'시각 모름':whenOut(d.when,d.lat,d.lng), d.when.note, d.weather].filter(Boolean).join(' · ')||'—')}</dd>`:''}<dt>${h(CUR.nameLabel)}</dt><dd>${h(d.local_name)}</dd>${CUR.usage&&!isMemory(d)?`<dt>${h(usageQ(CUR,d.category).label)}</dt><dd>${h(d.usage||'—')}</dd>`:''}<dt>이야기</dt><dd>${h(d.story||'—')}</dd></dl></div>
      <label class="check"><input type="checkbox" id="dshare" ${d.share?'checked':''}><span><b>${CUR.mode==='invite'?'수집단과 함께 보고, 골라서 도감·지도에 실어도 좋아요':'도감·지도에 실어도 좋아요'}</b><br><span class="small muted">${CUR.usage?'정확한 위치는 흐리게 표시해요.':'공개 지도에는 약 100m 단위로 흐리게 표시해요.'}</span></span></label>
      ${d.error?`<div class="err">${h(d.error)}</div>`:''}`;
    foot=`<button class="btn main block" id="submit" ${S.busy?'disabled':''}>${S.busy?`<span class="spinner"></span> 올리는 중…${(d.p1||d.p2)?' ('+mb((d.p1?d.p1.sent:0)+(d.p2?d.p2.sent:0))+')':''}`:(d.mode==='edit'?'고쳐서 다시 내기':'제출하기')}</button>`;
  }
  return `${head}<div class="stack" style="gap:14px">${body}</div><div class="actionbar">${foot}</div>
    <input type="file" id="fcam" accept="image/*" capture="environment" hidden><input type="file" id="fgal" accept="image/*" hidden>`;
}
function wordsOk(d){ return d.local_name.trim().length>0 && (!isMemory(d) || d.story.trim().length>0); }
function locMsg(d){
  if(d.lat==null) return '아직 지도 위치가 없어요.';
  const src={exif:'사진에 담긴 위치', device:'휴대폰 현재 위치', map:'지도에서 고른 위치'}[d.locMethod]||'위치';
  return `${src}를 썼어요${d.acc?` (오차 약 ${Math.round(d.acc)}m)`:''}.`;
}

let pickTarget=1, mapObj=null, marker=null;
function bindDraft(){
  const d=S.draft; const st=steps(d); const k=st[d.step-1];
  $('#back').onclick=()=>{ if(d.step>1){ d.step--; render(); } else { if(confirm('이 기록을 그만둘까요? 입력한 내용은 사라져요.')){ S.draft=null; go(''); } } };
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ d.category=b.dataset.cat; render(); });
  document.querySelectorAll('[data-ring]').forEach(b=>b.onclick=()=>{ d.keyring=b.dataset.ring; if(noRing(d)) d.p1=null; render(); });
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ pickTarget=+b.dataset.pick; (b.dataset.cap==='1'?$('#fcam'):$('#fgal')).click(); });
  ['#fcam','#fgal'].forEach(s=>{ const inp=$(s); inp.onchange=async ()=>{
    const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
    toast('사진을 준비하고 있어요…', 1500);
    try{
      const p=await takePhoto(f, pickTarget);
      p.fromCamera = (s==='#fcam');
      if(pickTarget===1){ d.p1=p; if(p.exif.lat!=null && d.locMethod!=='map'){ d.lat=p.exif.lat; d.lng=p.exif.lng; d.locMethod='exif'; d.acc=null; } }
      else { d.p2=p; if(d.lat==null && p.exif.lat!=null && d.locMethod!=='map'){ d.lat=p.exif.lat; d.lng=p.exif.lng; d.locMethod='exif'; d.acc=null; } }
      if(p.fromCamera && d.lat==null) tryGps(true);
      render();
    }catch(e){ toast('사진을 읽지 못했어요. 다른 사진으로 해 주세요.'); }
  }; });
  const tw=$('#tapwrap'); if(tw && d.p1) tw.onclick=async e=>{
    const rc=tw.getBoundingClientRect(); const pt={x:+((e.clientX-rc.left)/rc.width).toFixed(4), y:+((e.clientY-rc.top)/rc.height).toFixed(4)};
    if(pt.x<0||pt.x>1||pt.y<0||pt.y>1) return;
    const p=d.p1;
    if(!p.kxy){ p.kxy=pt; p.kblob=null; p.kbox=null; render(); const c=await cropKeyring(p.file, pt.x, pt.y); if(c && d.p1===p && p.kxy===pt){ p.kblob=c.blob; p.kbox=c.box; } }
    else { p.txy=pt; render(); await findColors(p); if(d.p1===p && p.txy===pt && steps(d)[d.step-1]==='p1') render(); }
  };
  const rt=$('#retap'); if(rt) rt.onclick=()=>{ if(d.p1){ d.p1.kxy=null; d.p1.txy=null; d.p1.kblob=null; d.p1.kbox=null; d.p1.cx=null; d.p1.cmain=null; } render(); };
  /* 키링 없이 올리는 기록: ② 사진에서 대상을 한 번 짚는다 */
  const tw2=$('#tapwrap2'); if(tw2 && d.p2) tw2.onclick=async e=>{
    const rc=tw2.getBoundingClientRect(); const pt={x:+((e.clientX-rc.left)/rc.width).toFixed(4), y:+((e.clientY-rc.top)/rc.height).toFixed(4)};
    if(pt.x<0||pt.x>1||pt.y<0||pt.y>1) return;
    const p=d.p2; p.txy=pt; render(); await findColors(p); if(d.p2===p && p.txy===pt && steps(d)[d.step-1]==='p2') render();
  };
  const rt2=$('#retap2'); if(rt2) rt2.onclick=()=>{ if(d.p2){ d.p2.txy=null; d.p2.cx=null; d.p2.cmain=null; } render(); };

function tryGps(silent){
  const d=S.draft; if(!navigator.geolocation){ if(!silent) toast('이 휴대폰에서는 위치를 쓸 수 없어요'); return; }
  if(!silent) toast('위치를 찾고 있어요…', 2000);
  navigator.geolocation.getCurrentPosition(pos=>{
    d.lat=pos.coords.latitude; d.lng=pos.coords.longitude; d.acc=pos.coords.accuracy; d.locMethod='device';
    if(sub()==='new'||sub().startsWith('edit/')){ const m=$('#locmsg'); if(m) m.textContent=locMsg(d); if(mapObj){ placeMarker(); mapObj.setView([d.lat,d.lng],15);} }
  }, err=>{ if(!silent) toast(err.code===1?'위치 사용이 허용되지 않았어요. 지도를 눌러 직접 표시해 주세요.':'위치를 찾지 못했어요. 지도를 눌러 표시해 주세요.', 3500); }, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}
function initMap(){
  const d=S.draft; if(!window.L){ $('#map').innerHTML='<p class="small muted" style="padding:12px">지도를 불러오지 못했어요. 동네만 골라 주세요.</p>'; return; }
  if(mapObj){ mapObj.remove(); mapObj=null; marker=null; }
  mapObj=L.map('map',{zoomControl:true, attributionControl:true}).setView(d.lat!=null?[d.lat,d.lng]:CUR.center, d.lat!=null?15:CUR.zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap'}).addTo(mapObj);
  if(d.lat!=null) placeMarker();
  mapObj.on('click', e=>{ d.lat=e.latlng.lat; d.lng=e.latlng.lng; d.acc=null; d.locMethod='map'; placeMarker(); const m=$('#locmsg'); if(m) m.textContent=locMsg(d); });
}
function placeMarker(){ const d=S.draft; if(!mapObj) return; if(marker) marker.setLatLng([d.lat,d.lng]); else marker=L.marker([d.lat,d.lng]).addTo(mapObj); }

async function submitDraft(){
  const d=S.draft; S.busy=true; d.error=''; render();
  const placeId=(S.places.find(p=>p.name===d.area)||{}).id||'';
  const row={
    edition:CUR.slug, category:d.category, keyring:(isMemory(d)||noRing(d))?'':d.keyring, is_memory:isMemory(d),
    local_name:d.local_name.trim(), color_name:(d.local_name.trim()||d.category).slice(0,30), usage:d.usage.trim(), story:d.story.trim(),
    area:d.area, place_id:placeId, place_name:d.area,
    lat:d.lat, lng:d.lng, gps_accuracy_m:d.acc, loc_method:d.locMethod||'none',
    share:!!d.share, user_agent:navigator.userAgent.slice(0,200), device_id:deviceId()
  };
  if(CUR.conditions && !isMemory(d)){ row.weather=d.weather||''; }
  if(CUR.tool){ row.tool=CUR.tool; row.chip_code=d.chip||null; row.no_match=!!d.noMatch && !d.chip; }
  if(d.p1){ row.photo1_taken_at=d.p1.exif.taken; row.exif1=d.p1.exif.raw; row.taken_at=d.p1.exif.taken;
    if(d.p1.kxy) row.keyring_xy=Object.assign({}, d.p1.kxy, d.p1.kbox?{crop:d.p1.kbox}:{});
    if(d.p1.txy) row.target_xy=d.p1.txy;
    const c1=draftColors(d.p1, 1); if(c1) row.colors=c1; }
  if(d.p2 && d.p2.txy && !d.p1){ row.target_xy=d.p2.txy; const c2=draftColors(d.p2, 2); if(c2) row.colors=c2; }
  if(d.p2){ row.photo2_taken_at=d.p2.exif.taken; row.exif2=d.p2.exif.raw; if(!row.taken_at) row.taken_at=d.p2.exif.taken; }
  if(CUR.conditions && !isMemory(d)){
    /* 찍은 때: 시각·위치로 해 높이를 계산해 이름표(light)를 붙인다. 시각을 모르면 내 말(time_note)만 */
    const w=d.when; row.time_note=(w.note||'').trim().slice(0,40)||null;
    const sp=(w.src!=='unknown' && w.taken) ? sunOf(w.taken, d.lat, d.lng) : null;
    if(sp){ row.taken_at=w.taken; row.sun_elev=sp.elev; row.light=sunLabel(sp); row.taken_src=w.src||'person'; }
    else { row.taken_at=null; row.sun_elev=null; row.light=''; row.taken_src='unknown'; }
  } else if(!row.taken_at && d.mode==='new') row.taken_at=new Date().toISOString();
  const item={id:d.id, mode:d.mode, row, p1:d.p1?d.p1.blob:null, p2:d.p2?d.p2.blob:null,
    k:d.p1?d.p1.kblob:null, s1:d.p1?d.p1.sblob:null, s2:d.p2?d.p2.sblob:null, created:Date.now(), thumb:null};
  try{ await idb.put(item); }catch(e){}
  try{
    await ensureSession();
    const uid=S.user.id;
    const ups=[];
    uploadsFor(item, uid, row, ups);
    /* 두 장을 동시에 보내고, 전파가 약해 90초 넘게 걸리면 휴대폰에 저장해 두고 나중에 이어서 보낸다 */
    await withTimeout(Promise.all(ups), 90000);
    if(d.mode==='edit'){
      if(!item.p1 && d.oldP1) delete row.photo1_path;
      const {error}=await sb.from('records').update(row).eq('id', d.id); if(error) throw error;
    } else {
      const {error}=await sb.from('records').insert(Object.assign({id:d.id}, row)); if(error && error.code!=='23505') throw error;
    }
    await idb.del(d.id).catch(()=>{});
    S.busy=false; S.lastDone={queued:false, mode:d.mode}; S.draft=null;
    await loadMine(); go('done');
  }catch(e){
    console.warn(e);
    S.busy=false;
    const offline = !navigator.onLine || /fetch|network|Failed|timeout/i.test(String(e.message||e));
    if(offline){ S.lastDone={queued:true, mode:d.mode}; S.draft=null; S.queue=await idb.all().catch(()=>[]); go('done'); setTimeout(()=>processQueue(), 60000); }
    else { d.error='올리지 못했어요: '+(e.message||e)+' — 잠시 뒤 다시 눌러 주세요. 입력한 내용은 그대로 있어요.'; render(); }
  }
}
