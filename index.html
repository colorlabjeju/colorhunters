<style>
:root{
  /* 팔레트: Silver Birch #D5DCDF · Blackthorn Berry #224653 · Willow Leaf #86915D */
  --birch:#D5DCDF; --berry:#224653; --willow:#86915D;
  --bg:#E8EDEF; --card:#F8FAFA; --ink:#224653; --ink2:#2F4A55; --ink3:#5B6E77; --line:#C9D2D6; --line2:#DDE3E6;

  --sea:#2C6E9B; --forest:#4D7A35; --flower:#B84A62;
  --warn-bg:#F6EED8; --warn-ink:#6E4A0C; --bad-bg:#F6E9EA; --bad-ink:#9C3A4E; --ok-bg:#E9ECDD; --ok-ink:#4F5A35;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink2);font-family:var(--font);font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--berry);color:#F8FAFA;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top b{font-size:17px;letter-spacing:-.01em}
.top small{font-size:13px;color:#B9C6CB}
.top a{color:#F8FAFA;font-size:15px;text-decoration:none;border:1px solid #4A6B77;border-radius:10px;padding:6px 12px}
main{max-width:560px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 56px);display:flex;flex-direction:column;gap:16px}
main.wide{max-width:1180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.h1{font-size:26px;line-height:1.3;font-weight:700;color:var(--ink)}
.h2{font-size:21px;line-height:1.35;font-weight:700;color:var(--ink)}
.h3{font-size:18px;font-weight:700;color:var(--ink)}
.muted{color:var(--ink3)}
.small{font-size:15px}
.xs{font-size:13px}
.eyebrow{font-size:14px;font-weight:700;color:var(--accent-text);letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--berry);border-color:var(--berry);color:#F8FAFA}
.btn.light{border-color:var(--line);color:var(--ink2);font-weight:500}
.btn.block{width:100%}
.btn.sm{min-height:44px;font-size:16px;padding:0 14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:8px 4px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:16px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.choice b{font-size:19px;color:var(--ink)}
.choice span{font-size:15px;color:var(--ink3)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
.chip[aria-pressed="true"]{border-color:var(--berry);background:var(--berry);color:#F8FAFA;font-weight:700}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:16px;border:3px solid var(--line);background:var(--card);cursor:pointer}
.ring i{width:46px;height:46px;border-radius:50%;border:8px solid currentColor;display:block}
.ring b{font-size:20px}

.ring[aria-pressed="true"]{border-color:currentColor;background:var(--soft)}
.progress{display:flex;gap:5px}

.progress i.on{background:var(--willow)}
.shot{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#DCE2E5;display:flex;align-items:center;justify-content:center;position:relative}

.notice{padding:14px 16px;border-radius:14px;background:var(--warn-bg);color:var(--warn-ink);font-size:16px}

.ok{padding:14px 16px;border-radius:14px;background:var(--ok-bg);color:var(--ok-ink);font-size:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;color:var(--ink);font-size:18px}
.field .hint{font-size:14px;color:var(--ink3)}
.input{width:100%;min-height:54px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:18px}
textarea.input{min-height:120px;line-height:1.55;resize:vertical}
.input:focus{border-color:var(--accent);outline:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}

.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;background:var(--birch);color:var(--ink2)}
.tag.ok{background:var(--ok-bg);color:var(--ok-ink)}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.bad{background:var(--bad-bg);color:var(--bad-ink)}
.rec{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;cursor:pointer;color:var(--ink2)}
.rec .th{width:76px;height:76px;border-radius:10px;background:#DCE2E5;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3)}
.rec .th img{width:100%;height:100%;object-fit:cover}
.rec.held{border:2px solid #D9B25E;background:#FBF6E8}
.map{height:260px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.check input{width:26px;height:26px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:50;max-width:92vw}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 관리자 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.adm{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:900px){.adm{grid-template-columns:360px minmax(0,1fr)}}
.qlist{display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow:auto}
.qitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;font-size:15px;color:var(--ink2)}
.qitem[aria-current="true"]{border:2px solid var(--accent);background:var(--soft)}
.qitem .th{width:56px;height:56px;border-radius:8px;background:#DCE2E5;overflow:hidden}
.qitem .th img{width:100%;height:100%;object-fit:cover}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.pics figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pics .ph{background:#1B3640;border-radius:12px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px}
.pics img{width:100%;height:100%;object-fit:contain}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--ink3);font-weight:500;font-size:13px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
.hero{display:flex;flex-direction:column;gap:10px;padding:8px 2px 4px}
.projs{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){.projs{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}}
.proj{display:grid;grid-template-columns:42% minmax(0,1fr);min-height:240px;padding:0;border:0;background:#E2E7E7;text-align:left;cursor:pointer;font:inherit;color:inherit;overflow:hidden}
.proj:hover .pmore,.proj:focus-visible .pmore{border-color:var(--ink)}
.pimg{position:relative;overflow:hidden;background:var(--birch)}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.swatch{position:absolute;inset:0;display:flex}
.swatch i{display:block;height:100%}
.pbody{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px 20px}
.ptag{display:inline-block;padding:5px 10px;border:1px solid #C3CCCF;background:#F3F6F6;color:var(--accent-text);font-size:13px;line-height:1.3}
.ptitle{font-size:24px;line-height:1.3;font-weight:700;color:var(--ink);margin-top:6px}
.pdesc{font-size:15px;line-height:1.6;color:var(--ink3)}
.pmore{margin-top:auto;padding:12px 0 6px;font-size:15px;font-weight:500;color:var(--ink);border-bottom:1px solid #9FAEB3}
@media(max-width:480px){.proj{grid-template-columns:34% minmax(0,1fr);min-height:220px}.pbody{padding:18px 14px;gap:8px}.ptag{font-size:12px;padding:4px 8px;white-space:nowrap}.ptitle{font-size:22px}}
.aboutimg{position:relative;height:150px;overflow:hidden;background:var(--birch)}
.aboutimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);text-align:left;cursor:pointer;font:inherit;color:inherit}
.gimg{aspect-ratio:1;background:#DCE2E5;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:14px}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.gtxt{display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.gtxt b{color:var(--ink);font-size:16px}
.gtxt span{color:var(--ink3);font-size:13px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,40,48,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){.sheet{align-items:center}.sheet-in{border-radius:20px}}
dl{margin:0;display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;font-size:16px}
dt{color:var(--ink3)}
dd{margin:0}
</style>
</head>
<body>
<header class="top" id="top"><div><b>컬러헌터스</b> <small id="topsub"></small></div><span id="topright"></span></header>
<main id="view"><div class="card"><p class="muted">불러오는 중…</p></div></main>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

/* ================= 설정 ================= */
const SUPABASE_URL = 'https://wyzgzidtholzrokhvzrr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KhnJXKmHq3v51UaUkaPluA_XAOkBfK_';
const EDITION = 'ulleung';
const BUCKET = 'record-photos';
const CONSENT_VERSION = 'ul-2026-11';
const GAP_WARN_MIN = 5;
const UL_CENTER = [37.505, 130.865];

const CATS = [
  {v:'나물·약초', ex:'명이, 부지깽이, 묵나물·장아찌'},
  {v:'식물·꽃·열매', ex:'마가목 열매, 해안 들꽃'},
  {v:'농작물·먹거리', ex:'늦호박, 호박엿'},
  {v:'생업 재료', ex:'오징어 덕장, 어구'},
  {v:'기억 카드', ex:'지금 볼 수 없는 것 — 사진 없이 이야기만'}
];
const RINGS = [
  {v:'바다', c:'var(--sea)', ex:'바닷물·갯바위·해조류'},
  {v:'숲', c:'var(--forest)', ex:'나물·약초·잎·이끼'},
  {v:'꽃', c:'var(--flower)', ex:'꽃·열매·호박·먹거리'}
];
const STATUS = {pending:['확인 중',''], approved:['인정','ok'], held:['보완 요청','warn'], rejected:['반려','bad']};
const REASONS = ['키링이 안 보이거나 작음','키링과 대상의 빛이 다름','흔들린 사진','두 사진의 자리·빛이 다름','울릉 이름·이야기가 부족함','위치가 없음','같은 대상이 이미 있음'];

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});

/* ================= 상태 ================= */
const S = {
  user:null, me:null /* {nickname, role, consent_at} */, edition:null, places:[],
  records:[], thumbs:{}, queue:[], draft:null, busy:false,
  adm:{filter:'pending', sel:null, list:[], authors:{}, invites:[], tab:'review', urls:{}, memo:'', reasons:[]}
};
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmt = iso => { if(!iso) return '—'; const d=new Date(iso); return `${d.getMonth()+1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const tag = st => { const [t,c]=STATUS[st]||STATUS.pending; return `<span class="tag ${c}">${t}</span>`; };
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, ms); }
function deviceId(){ let d=localStorage.getItem('ch_device'); if(!d){ d=crypto.randomUUID(); localStorage.setItem('ch_device', d);} return d; }
const inApp = /KAKAOTALK|NAVER\(|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);

/* ================= 오프라인 대기열 (IndexedDB) ================= */
const idb = (() => {
  let dbp;
  function db(){ if(!dbp) dbp=new Promise((ok,no)=>{ const r=indexedDB.open('colorhunters',1); r.onupgradeneeded=()=>r.result.createObjectStore('queue',{keyPath:'id'}); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }); return dbp; }
  async function tx(mode, fn){ const d=await db(); return new Promise((ok,no)=>{ const t=d.transaction('queue',mode); const st=t.objectStore('queue'); const r=fn(st); t.oncomplete=()=>ok(r&&r.result); t.onerror=()=>no(t.error); }); }
  return {
    put: item => tx('readwrite', st => st.put(item)),
    del: id => tx('readwrite', st => st.delete(id)),
    all: () => tx('readonly', st => st.getAll())
  };
})();

/* ================= 사진 처리 ================= */
async function readExif(file){
  const out = {taken:null, lat:null, lng:null, make:'', model:'', raw:null};
  try{
    const x = await window.exifr.parse(file, {tiff:true, exif:true, gps:true, ifd1:false, xmp:false, icc:false, iptc:false, jfif:false, ihdr:false});
    if(x){
      const dt = x.DateTimeOriginal || x.CreateDate || x.ModifyDate;
      if(dt instanceof Date && !isNaN(dt)) out.taken = dt.toISOString();
      if(typeof x.latitude==='number' && typeof x.longitude==='number' && !isNaN(x.latitude)){ out.lat=x.latitude; out.lng=x.longitude; }
      out.make=x.Make||''; out.model=x.Model||'';
      const keep=['DateTimeOriginal','OffsetTimeOriginal','Make','Model','LensModel','ExposureTime','FNumber','ISOSpeedRatings','ISO','WhiteBalance','ExposureBiasValue','Flash','ColorSpace','latitude','longitude','GPSAltitude','GPSHPositioningError','Software'];
      const raw={}; keep.forEach(k=>{ if(x[k]!==undefined && x[k]!==null) raw[k]=x[k]; });
      out.raw = JSON.parse(JSON.stringify(raw));
    }
  }catch(e){}
  if(!out.taken && file.lastModified) out.taken = new Date(file.lastModified).toISOString();
  return out;
}
async function shrink(file, max, q){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){ bmp = await new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=URL.createObjectURL(file); }); }
  const W = bmp.width||bmp.naturalWidth, H = bmp.height||bmp.naturalHeight;
  const s = Math.min(1, max/Math.max(W,H));
  const c = document.createElement('canvas'); c.width=Math.round(W*s); c.height=Math.round(H*s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(ok=>c.toBlob(ok,'image/jpeg',q));
  return {blob, w:W, h:H};
}
async function takePhoto(file, which){
  const exif = await readExif(file);
  const {blob, w, h:ht} = await shrink(file, which===1?2048:1600, which===1?0.92:0.85);
  return {blob, url:URL.createObjectURL(blob), exif, w, h:ht, bytes:file.size, type:file.type};
}

/* ================= 인증·초대 ================= */
async function ensureSession(){
  const {data:{session}} = await sb.auth.getSession();
  if(session) { S.user = session.user; return session.user; }
  const {data, error} = await sb.auth.signInAnonymously();
  if(error) throw error;
  S.user = data.user; return data.user;
}
async function redeem(token){
  await ensureSession();
  const {data, error} = await sb.rpc('redeem_invite', {p_token: token});
  if(error) throw error;
  localStorage.setItem('ch_invite', token);
  S.me = data; localStorage.setItem('ch_me', JSON.stringify(data));
  return data;
}
async function loadMe(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){
    const tok = localStorage.getItem('ch_invite');
    if(tok){ try{ await redeem(tok); return true; }catch(e){ return false; } }
    return false;
  }
  S.user = session.user;
  const {data:roles} = await sb.from('user_roles').select('role,edition').eq('user_id', S.user.id);
  if(!roles || !roles.length){
    const tok = localStorage.getItem('ch_invite');
    if(tok){ try{ await redeem(tok); return true; }catch(e){ return false; } }
    return false;
  }
  const cached = JSON.parse(localStorage.getItem('ch_me')||'null');
  S.me = Object.assign({nickname:'', consent_at:null}, cached||{}, {role: roles[0].role});
  return true;
}

/* ================= 데이터 ================= */
async function loadEdition(){
  const {data} = await sb.from('editions').select('*').eq('slug', EDITION).single();
  S.edition = data; S.places = (data && data.places) || [];

async function loadMine(){
  if(!S.user) return;
  const {data, error} = await sb.from('records').select('*').eq('author', S.user.id).eq('edition', EDITION).order('created_at', {ascending:false});
  if(!error) S.records = data||[];
  S.queue = (await idb.all().catch(()=>[])) || [];
  for(const r of S.records){ if(r.photo2_path && !S.thumbs[r.id]) signThumb(r); else if(r.photo1_path && !S.thumbs[r.id]) signThumb(r); }
}
async function signThumb(r){
  const p = r.photo2_path || r.photo1_path; if(!p) return;
  const r2 = await sb.storage.from(BUCKET).createSignedUrl(p, 3600).catch(()=>({}));
  const url = r2 && r2.data && r2.data.signedUrl;
  if(url){ S.thumbs[r.id]=url; const im=document.querySelector(`[data-th="${r.id}"]`); if(im) im.innerHTML=`<img src="${h(url)}" alt="">`; }
}

/* ================= 업로드 ================= */
async function uploadBlob(path, blob){
  const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(error && !/exists|Duplicate/i.test(error.message||'')) throw error;
}
async function processQueue(){
  if(processQueue.running) return; processQueue.running = true;
  try{
    const items = await idb.all();
    for(const it of items){
      try{
        await ensureSession();
        const uid = S.user.id; const row = Object.assign({}, it.row);
        if(it.p1){ row.photo1_path = `${uid}/${it.id}-1.jpg`; await uploadBlob(row.photo1_path, it.p1); }
        if(it.p2){ row.photo2_path = `${uid}/${it.id}-2.jpg`; await uploadBlob(row.photo2_path, it.p2); }
        if(it.mode==='edit'){
          const {error} = await sb.from('records').update(row).eq('id', it.id);
          if(error) throw error;
        } else {
          const {error} = await sb.from('records').insert(Object.assign({id: it.id}, row));
          if(error && error.code !== '23505') throw error;
        }
        await idb.del(it.id);
      }catch(e){ console.warn('queue item failed', e); it.lastError = String(e.message||e); await idb.put(it).catch(()=>{}); }
    }
  } finally { processQueue.running = false; }
  await loadMine(); if(route()==='home' || route()==='') render();
}
window.addEventListener('online', ()=>processQueue());

  if(r.startsWith('edit/')){ const id=r.slice(5); if(!S.draft || S.draft.id!==id){ const rec=S.records.find(x=>x.id===id); if(!rec){ go(''); return; } S.draft = draftFrom(rec); } v.innerHTML=vDraft(); bindDraft(); return; }

      <div class="shot">${d.p2?`<img src="${h(d.p2.url)}" alt="키링 없이 찍은 사진"><span class="badge">② 키링 없이</span>`:(d.oldP2?'<span class="muted small">이미 올린 사진이 있어요</span>':'<span class="muted">아직 사진이 없어요</span>')}</div>

function wordsOk(d){ return d.local_name.trim().length>0 && (!isMemory(d) || d.story.trim().length>0); }
function locMsg(d){
  if(d.lat==null) return '아직 지도 위치가 없어요.';
  const src={exif:'사진에 담긴 위치', device:'휴대폰 현재 위치', map:'지도에서 고른 위치'}[d.locMethod]||'위치';
  return `${src}를 썼어요${d.acc?` (오차 약 ${Math.round(d.acc)}m)`:''}.`;
}

let pickTarget=1, mapObj=null, marker=null;
function bindDraft(){
  const d=S.draft; const st=steps(d); const k=st[d.step-1];
  $('#back').onclick=()=>{ if(d.step>1){ d.step--; render(); } else { if(confirm('이 기록을 그만둘까요? 입력한 내용은 사라져요.')){ S.draft=null; go(''); } } };
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ d.category=b.dataset.cat; render(); });
  document.querySelectorAll('[data-ring]').forEach(b=>b.onclick=()=>{ d.keyring=b.dataset.ring; render(); });
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ pickTarget=+b.dataset.pick; (b.dataset.cap==='1'?$('#fcam'):$('#fgal')).click(); });
  ['#fcam','#fgal'].forEach(s=>{ const inp=$(s); inp.onchange=async ()=>{
    const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
    toast('사진을 준비하고 있어요…', 1500);
    try{
      const p=await takePhoto(f, pickTarget);
      p.fromCamera = (s==='#fcam');
      if(pickTarget===1){ d.p1=p; if(p.exif.lat!=null && d.locMethod!=='map'){ d.lat=p.exif.lat; d.lng=p.exif.lng; d.locMethod='exif'; d.acc=null; } }
      else d.p2=p;
      if(p.fromCamera && d.lat==null) tryGps(true);
      render();
    }catch(e){ toast('사진을 읽지 못했어요. 다른 사진으로 해 주세요.'); }
  }; });
  const nx=$('#next'); if(nx) nx.onclick=()=>{ d.step++; render(); window.scrollTo(0,0); };
  if(k==='where'){
    $('#area').onchange=e=>{ d.area=e.target.value; $('#next').disabled=!d.area; };
    $('#gps').onclick=()=>tryGps(false);
    initMap();
  }
  if(k==='words'){
    const upd=()=>{ d.local_name=$('#ln').value; d.usage=$('#us').value; d.story=$('#sto').value; $('#next').disabled=!wordsOk(d); };
    ['#ln','#us','#sto'].forEach(s=>$(s).addEventListener('input', upd));
  }
  if(k==='check'){
    $('#dshare').onchange=e=>{ d.share=e.target.checked; };
    $('#submit').onclick=submitDraft;
  }
}
function tryGps(silent){
  const d=S.draft; if(!navigator.geolocation){ if(!silent) toast('이 휴대폰에서는 위치를 쓸 수 없어요'); return; }
  if(!silent) toast('위치를 찾고 있어요…', 2000);
  navigator.geolocation.getCurrentPosition(pos=>{
    d.lat=pos.coords.latitude; d.lng=pos.coords.longitude; d.acc=pos.coords.accuracy; d.locMethod='device';
    if(route()==='new'||route().startsWith('edit/')){ const m=$('#locmsg'); if(m) m.textContent=locMsg(d); if(mapObj){ placeMarker(); mapObj.setView([d.lat,d.lng],15);} }
  }, err=>{ if(!silent) toast(err.code===1?'위치 사용이 허용되지 않았어요. 지도를 눌러 직접 표시해 주세요.':'위치를 찾지 못했어요. 지도를 눌러 표시해 주세요.', 3500); }, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}
function initMap(){
  const d=S.draft; if(!window.L){ $('#map').innerHTML='<p class="small muted" style="padding:12px">지도를 불러오지 못했어요. 동네만 골라 주세요.</p>'; return; }
  if(mapObj){ mapObj.remove(); mapObj=null; marker=null; }
  mapObj=L.map('map',{zoomControl:true, attributionControl:true}).setView(d.lat!=null?[d.lat,d.lng]:UL_CENTER, d.lat!=null?15:12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap'}).addTo(mapObj);
  if(d.lat!=null) placeMarker();
  mapObj.on('click', e=>{ d.lat=e.latlng.lat; d.lng=e.latlng.lng; d.acc=null; d.locMethod='map'; placeMarker(); const m=$('#locmsg'); if(m) m.textContent=locMsg(d); });
}
function placeMarker(){ const d=S.draft; if(!mapObj) return; if(marker) marker.setLatLng([d.lat,d.lng]); else marker=L.marker([d.lat,d.lng]).addTo(mapObj); }

async function submitDraft(){
  const d=S.draft; S.busy=true; d.error=''; render();
  const placeId=(S.places.find(p=>p.name===d.area)||{}).id||'';
  const row={
    edition:EDITION, category:d.category, keyring:isMemory(d)?'':d.keyring, is_memory:isMemory(d),
    local_name:d.local_name.trim(), color_name:(d.local_name.trim()||d.category).slice(0,30), usage:d.usage.trim(), story:d.story.trim(),
    area:d.area, place_id:placeId, place_name:d.area,
    lat:d.lat, lng:d.lng, gps_accuracy_m:d.acc, loc_method:d.locMethod||'none',
    share:!!d.share, user_agent:navigator.userAgent.slice(0,200), device_id:deviceId()
  };
  if(d.p1){ row.photo1_taken_at=d.p1.exif.taken; row.exif1=d.p1.exif.raw; row.taken_at=d.p1.exif.taken; }
  if(d.p2){ row.photo2_taken_at=d.p2.exif.taken; row.exif2=d.p2.exif.raw; }
  if(!row.taken_at && d.mode==='new') row.taken_at=new Date().toISOString();
  const item={id:d.id, mode:d.mode, row, p1:d.p1?d.p1.blob:null, p2:d.p2?d.p2.blob:null, created:Date.now(), thumb:null};
  try{ await idb.put(item); }catch(e){}
  try{
    await ensureSession();
    const uid=S.user.id;
    if(item.p1){ row.photo1_path=`${uid}/${d.id}-1.jpg`; await uploadBlob(row.photo1_path, item.p1); }
    if(item.p2){ row.photo2_path=`${uid}/${d.id}-2.jpg`; await uploadBlob(row.photo2_path, item.p2); }
    if(d.mode==='edit'){
      if(!item.p1 && d.oldP1) delete row.photo1_path;
      const {error}=await sb.from('records').update(row).eq('id', d.id); if(error) throw error;
    } else {
      const {error}=await sb.from('records').insert(Object.assign({id:d.id}, row)); if(error && error.code!=='23505') throw error;
    }
    await idb.del(d.id).catch(()=>{});
    S.busy=false; S.lastDone={queued:false, mode:d.mode}; S.draft=null;
    await loadMine(); go('done');
  }catch(e){
    console.warn(e);
    S.busy=false;
    const offline = !navigator.onLine || /fetch|network|Failed/i.test(String(e.message||e));
    if(offline){ S.lastDone={queued:true, mode:d.mode}; S.draft=null; S.queue=await idb.all().catch(()=>[]); go('done'); }
    else { d.error='올리지 못했어요: '+(e.message||e)+' — 잠시 뒤 다시 눌러 주세요. 입력한 내용은 그대로 있어요.'; render(); }
  }
}
function vDone(){
  const q=S.lastDone&&S.lastDone.queued;
  return `<div class="card stack" style="gap:14px;text-align:center;padding:28px 18px">
    <p style="font-size:44px;line-height:1">${q?'📥':'✅'}</p>
    <h1 class="h2">${q?'휴대폰에 저장했어요':'제출했어요'}</h1>
    <p>${q?'인터넷이 잡히면 첫 화면에서 «지금 보내기»를 눌러 주세요. 저절로 보내지기도 해요.':'컬러랩제주가 확인한 뒤 인정하거나, 모자란 부분의 보완을 부탁드려요.'}</p>
    <button class="btn main block" id="start">＋ 하나 더 기록하기</button>
    <a class="btn light block" href="#/">내 기록 보기</a></div>`;
}

/* ================= 관리자 ================= */
async function renderAdmin(){
  const A=S.adm; const v=$('#view');
  v.innerHTML=`<div class="row between"><h1 class="h2">울릉 색채수집단 관리</h1>
    <div class="tabs">${[['review','검수'],['people','참여자·링크'],['export','내보내기']].map(([k,t])=>`<button class="chip" data-tab="${k}" aria-pressed="${A.tab===k}">${t}</button>`).join('')}</div></div>
    <div id="admbody"><div class="card muted">불러오는 중…</div></div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ A.tab=b.dataset.tab; renderAdmin(); });
  if(A.tab==='review') await admReview();
  else if(A.tab==='people') await admPeople();
  else await admExport();
}
async function admLoad(){
  const A=S.adm;
  const {data, error}=await sb.from('records').select('*').eq('edition', EDITION).order('created_at',{ascending:true});
  if(error){ $('#admbody').innerHTML=`<div class="err">불러오지 못했어요: ${h(error.message)}</div>`; return false; }
  A.list=data||[];
  const {data:au}=await sb.rpc('record_authors',{p_edition:EDITION});
  A.authors={}; (au||[]).forEach(x=>A.authors[x.user_id]=x.nickname);
  return true;
}
async function admReview(){
  const A=S.adm; if(!(await admLoad())) return;
  const c={pending:0,held:0,approved:0,rejected:0}; A.list.forEach(r=>c[r.status]++);
  const list=A.list.filter(r=>A.filter==='all'||r.status===A.filter);
  if(!A.sel || !list.find(r=>r.id===A.sel)) A.sel=list[0]?list[0].id:null;
  const cur=A.list.find(r=>r.id===A.sel);
  $('#admbody').innerHTML=`<div class="tabs" style="margin-bottom:12px">${[['pending','확인 중'],['held','보완 요청'],['approved','인정'],['rejected','반려'],['all','전체']].map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${A.filter===k}">${t} ${k==='all'?A.list.length:c[k]}</button>`).join('')}</div>
   <div class="adm"><div class="qlist">${list.length?list.map(r=>`<button class="qitem" data-sel="${h(r.id)}" aria-current="${r.id===A.sel}"><div class="th" data-qt="${h(r.id)}"></div><div style="min-width:0"><b>${h(r.local_name||r.color_name)}</b><br><span class="xs muted">${h(A.authors[r.author]||'?')} · ${h(r.category)} · ${h(r.area||'')}</span></div><div>${tag(r.status)}<br><span class="xs muted">${fmt(r.created_at)}</span></div></button>`).join(''):'<div class="card muted">해당하는 기록이 없어요.</div>'}</div>
   <div>${cur?admDetail(cur):''}</div></div>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ A.filter=b.dataset.f; A.sel=null; admReview(); });
  document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ A.sel=b.dataset.sel; A.memo=''; A.reasons=[]; admReview(); });
  list.slice(0,80).forEach(async r=>{ const p=r.photo2_path||r.photo1_path; if(!p) return; const u=await admUrl(p); const el=document.querySelector(`[data-qt="${r.id}"]`); if(el&&u) el.innerHTML=`<img src="${h(u)}" alt="">`; });
  if(cur) bindDetail(cur);
}
async function admUrl(p){ const A=S.adm; if(A.urls[p]) return A.urls[p]; const {data}=await sb.storage.from(BUCKET).createSignedUrl(p, 3600); if(data){ A.urls[p]=data.signedUrl; return data.signedUrl;} return null; }
function admDetail(r){
  const A=S.adm;
  const gap=(r.photo1_taken_at&&r.photo2_taken_at)?Math.round(Math.abs(new Date(r.photo1_taken_at)-new Date(r.photo2_taken_at))/60000):null;
  const ex=r.exif1||{};
  return `<div class="card stack" style="gap:14px">
    <div class="row between"><div><h2 class="h2">${h(r.local_name||r.color_name)}</h2><p class="small muted">${h(A.authors[r.author]||'?')} · ${fmt(r.created_at)}${r.resubmitted_at?' · 보완 후 다시 냄':''}</p></div>${tag(r.status)}</div>
    ${r.is_memory?'<p><span class="tag">기억 카드 — 사진 없음</span></p>':`<div class="pics"><figure><div class="ph" data-big="${h(r.photo1_path||'')}">불러오는 중</div><figcaption class="xs muted">① 키링과 함께 · ${h(r.keyring||'')} 키링 · ${fmt(r.photo1_taken_at)}</figcaption></figure><figure><div class="ph" data-big="${h(r.photo2_path||'')}">${r.photo2_path?'불러오는 중':'없음'}</div><figcaption class="xs muted">② 키링 없이 · ${fmt(r.photo2_taken_at)}</figcaption></figure></div>`}
    ${gap!=null&&gap>GAP_WARN_MIN?`<div class="notice small">두 사진 촬영 간격 ${gap}분</div>`:''}
    <dl><dt>분류</dt><dd>${h(r.category)}</dd><dt>동네</dt><dd>${h(r.area||'—')}${r.lat?` · <a href="https://www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lng}#map=17/${r.lat}/${r.lng}" target="_blank" rel="noopener">지도</a> (${h(r.loc_method)})`:' · 좌표 없음'}</dd>
      <dt>쓰임</dt><dd>${h(r.usage||'—')}</dd><dt>이야기</dt><dd style="white-space:pre-wrap">${h(r.story||'—')}</dd>
      <dt>기기</dt><dd class="small">${h([ex.Make,ex.Model].filter(Boolean).join(' ')||'—')}</dd><dt>공개</dt><dd>${r.share?'동의':'비공개'}</dd></dl>
    ${r.review_memo?`<div class="small muted">이전 검수 메모: ${h(r.review_memo)} ${h((r.review_reasons||[]).join(', '))}</div>`:''}
    <div class="stack"><b>보완 사유</b><div class="row">${REASONS.map(x=>`<button class="chip" data-rs="${h(x)}" aria-pressed="${A.reasons.includes(x)}">${h(x)}</button>`).join('')}</div>
      <textarea id="memo" class="input" style="min-height:70px" placeholder="주민에게 보일 메모 (예: 키링이 그늘에 있어요. 둘 다 그늘에서 다시 찍어 주세요)">${h(A.memo)}</textarea></div>
    <div class="row"><button class="btn main" data-set="approved">인정</button><button class="btn" data-set="held" style="border-color:#C98A1B;color:#7A4A08">보완 요청</button><button class="btn light" data-set="rejected">반려</button><button class="btn light" data-set="pending">확인 중으로</button></div>
  </div>`;
}
function bindDetail(r){
  const A=S.adm;
  document.querySelectorAll('[data-big]').forEach(async el=>{ const p=el.dataset.big; if(!p) return; const u=await admUrl(p); if(u) el.innerHTML=`<a href="${h(u)}" target="_blank" rel="noopener" style="display:block;width:100%;height:100%"><img src="${h(u)}" alt=""></a>`; });
  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{ const x=b.dataset.rs; A.memo=$('#memo').value; A.reasons=A.reasons.includes(x)?A.reasons.filter(y=>y!==x):[...A.reasons,x]; b.setAttribute('aria-pressed', A.reasons.includes(x)); });
  $('#memo').oninput=e=>{ A.memo=e.target.value; };
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=async ()=>{
    const st=b.dataset.set;
    if(st==='held' && !A.memo.trim() && !A.reasons.length){ toast('보완 요청은 사유나 메모를 남겨 주세요'); return; }
    b.disabled=true;
    const {error}=await sb.from('records').update({status:st, review_memo:st==='approved'?'':A.memo.trim(), review_reasons:st==='approved'?[]:A.reasons}).eq('id', r.id);
    if(error){ toast('저장 실패: '+error.message); b.disabled=false; return; }
    toast({approved:'인정했어요',held:'보완 요청을 보냈어요',rejected:'반려했어요',pending:'확인 중으로 돌렸어요'}[st]);
    A.memo=''; A.reasons=[];
    const list=A.list.filter(x=>A.filter==='all'||x.status===A.filter); const i=list.findIndex(x=>x.id===r.id);
    A.sel = (list[i+1]||list[i-1]||{}).id || null;
    admReview();
  });
}
async function admPeople(){
  const {data, error}=await sb.rpc('admin_invites');
  if(error){ $('#admbody').innerHTML=`<div class="err">${h(error.message)}</div>`; return; }
  const base=location.origin+location.pathname;
  const rows=(data||[]).filter(x=>x.edition===EDITION||x.role==='admin');
  $('#admbody').innerHTML=`<div class="card stack"><p class="h3">새 참여자 링크 만들기</p>
    <div class="row" style="align-items:flex-end">
      <div class="field" style="flex:1 1 140px"><label for="n1" style="font-size:15px">별칭(공개)</label><input id="n1" class="input" placeholder="예: 도동 김선생"></div>
      <div class="field" style="flex:1 1 120px"><label for="n2" style="font-size:15px">실명(비공개)</label><input id="n2" class="input"></div>
      <div class="field" style="flex:1 1 140px"><label for="n3" style="font-size:15px">연락처(비공개)</label><input id="n3" class="input" inputmode="tel"></div>
      <div class="field" style="flex:0 1 130px"><label for="n4" style="font-size:15px">역할</label><select id="n4" class="input"><option value="surveyor">수집단</option><option value="reviewer">검수자</option></select></div>
      <button class="btn main" id="mk">만들기</button></div></div>
    <div class="card" style="overflow-x:auto"><table><tr><th>별칭</th><th>실명·연락처</th><th>역할</th><th>접속</th><th>올림</th><th>인정</th><th>확인 중</th><th>보완</th><th>예상 활동비</th><th>개인 링크</th></tr>
    ${rows.map(x=>{ const link=`${base}#/i/${x.token}`; const pay = x.role==='surveyor' ? (100000+Number(x.approved)*20000).toLocaleString('ko-KR')+'원' : '—';
      return `<tr><td><b>${h(x.nickname)}</b></td><td class="small">${h(x.real_name)}<br>${h(x.phone)}</td><td class="small">${{surveyor:'수집단',reviewer:'검수자',admin:'관리자'}[x.role]}</td><td class="small">${x.redeemed_at?fmt(x.redeemed_at):'<span class="muted">아직</span>'}${x.consent_at?'<br>동의 완료':''}</td><td>${x.total}</td><td><b>${x.approved}</b></td><td>${x.pending}</td><td>${x.held}</td><td class="small">${pay}</td><td><button class="btn light sm" data-copy="${h(link)}">링크 복사</button></td></tr>`; }).join('')}
    </table><p class="xs muted" style="margin-top:8px">예상 활동비 = 기본 100,000원 + 인정 건수 × 20,000원 (1인 최대 건수 상한은 아직 반영하지 않음). 관리자 링크는 남에게 보내지 마세요.</p></div>`;
  $('#mk').onclick=async ()=>{
    const nick=$('#n1').value.trim(); if(!nick){ toast('별칭을 적어 주세요'); return; }
    const {data:tok, error:e2}=await sb.rpc('admin_create_invite',{p_edition:EDITION, p_role:$('#n4').value, p_nickname:nick, p_real_name:$('#n2').value.trim(), p_phone:$('#n3').value.trim(), p_memo:''});
    if(e2){ toast('만들지 못했어요: '+e2.message); return; }
    await navigator.clipboard.writeText(`${base}#/i/${tok}`).catch(()=>{});
    toast('만들었어요. 링크를 복사했어요'); admPeople();
  };
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async ()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); toast('복사했어요'); }catch(e){ prompt('이 링크를 복사하세요', b.dataset.copy); } });
}
async function admExport(){
  if(!(await admLoad())) return;
  const A=S.adm;
  $('#admbody').innerHTML=`<div class="card stack"><p>기록 ${A.list.length}건을 엑셀에서 열 수 있는 CSV로 내려받습니다. 사진은 경로만 들어갑니다.</p>
    <div class="row"><button class="btn main" id="csvall">전체 CSV</button><button class="btn" id="csvok">인정 기록만 CSV</button></div></div>`;
  const dl=(rows, name)=>{
    const cols=['id','status','nickname','category','local_name','usage','story','keyring','area','lat','lng','loc_method','photo1_taken_at','photo2_taken_at','created_at','share','review_memo','photo1_path','photo2_path'];
    const esc=v=>{ const s=v==null?'':String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const csv='﻿'+cols.join(',')+'\n'+rows.map(r=>cols.map(c=>esc(c==='nickname'?A.authors[r.author]:r[c])).join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=name; a.click();
  };
  $('#csvall').onclick=()=>dl(A.list, `ulleung-records-${new Date().toISOString().slice(0,10)}.csv`);
  $('#csvok').onclick=()=>dl(A.list.filter(r=>r.status==='approved'), `ulleung-approved-${new Date().toISOString().slice(0,10)}.csv`);
}

/* ================= 시작 ================= */
async function boot(){
  try{
    const r=route();
    await loadEdition().catch(()=>{});
    if(r.startsWith('i/')){
      $('#view').innerHTML='<div class="card"><p>초대 링크를 확인하고 있어요…</p></div>';
      try{ await redeem(r.slice(2).trim()); history.replaceState(null,'', location.pathname+'#/'); }
      catch(e){ $('#view').innerHTML=`<div class="card stack"><h1 class="h2">링크를 열지 못했어요</h1><p>링크가 잘못됐거나 인터넷이 약해요. 다시 눌러 보고, 계속 안 되면 단톡방에 알려 주세요.</p><p class="xs muted">${h(e.message||e)}</p></div>`; return; }
    } else {
      await loadMe();
    }
    if(S.me){ await loadMine(); processQueue(); }
    render();
  }catch(e){
    console.error(e);
    $('#view').innerHTML=`<div class="card stack"><h1 class="h2">불러오지 못했어요</h1><p>인터넷 연결을 확인하고 새로고침해 주세요.</p><p class="xs muted">${h(e.message||e)}</p></div>`;
  }
}
boot();
</script>
