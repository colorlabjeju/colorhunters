function bindDetail(r){
  const A=S.adm;
  document.querySelectorAll('[data-big]').forEach(async el=>{ const p=el.dataset.big; if(!p) return; const u=await admUrl(p); if(u) el.innerHTML=`<a href="${h(u)}" target="_blank" rel="noopener" style="display:block;width:100%;height:100%"><img src="${h(u)}" alt=""></a>`; });
  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{ const x=b.dataset.rs; A.memo=$('#memo').value; A.reasons=A.reasons.includes(x)?A.reasons.filter(y=>y!==x):[...A.reasons,x]; b.setAttribute('aria-pressed', A.reasons.includes(x)); });
  $('#memo').oninput=e=>{ A.memo=e.target.value; };
  const ac=$('#acat'); if(ac) ac.onchange=async e=>{
    const v=e.target.value, prev=r.category; ac.disabled=true;
    const {error}=await sb.from('records').update({category:v}).eq('id', r.id);
    ac.disabled=false;
    if(error){ toast('분류를 바꾸지 못했어요: '+error.message); ac.value=prev; return; }
    r.category=v; const it=A.list.find(x=>x.id===r.id); if(it) it.category=v;
    toast('분류를 «'+v+'»(으)로 바꿨어요');
  };
  const fo=$('#fillone'); if(fo) fo.onclick=async ()=>{ fo.disabled=true; fo.textContent='채우는 중…';
    try{ await fillRecord(r); toast('미리보기와 색을 채웠어요'); }catch(e){ toast('채우지 못했어요: '+(e.message||'')); }
    admReview(); };
  const pk=$('#pick'); if(pk) pk.onclick=async ()=>{
    pk.disabled=true; const want=!r.public_pick;
    const {data, error}=await sb.from('records').update({public_pick:want}).eq('id', r.id).select('public_pick,public_picked_at').single();
    if(error || !data || data.public_pick!==want){ toast('저장하지 못했어요'+(error?': '+error.message:'')); pk.disabled=false; return; }
    Object.assign(r, data); delete S.gallery[A.ed];
    toast(want?'공개 선정했어요. 누구나 보는 «모인 기록»에 나가요':'공개 선정을 취소했어요');
    admReview();
  };
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=async ()=>{
    const st=b.dataset.set;
    if(st==='held' && !A.memo.trim() && !A.reasons.length){ toast('보완 요청은 사유나 메모를 남겨 주세요'); return; }
    b.disabled=true;
    /* reviewed_at을 함께 보내야, 인정 후 고친 기록을 다시 «인정»했을 때 «한 번 더 봐 주세요» 표시가 사라진다 */
    const {error}=await sb.from('records').update({status:st, review_memo:st==='approved'?'':A.memo.trim(), review_reasons:st==='approved'?[]:A.reasons, reviewed_at:new Date().toISOString()}).eq('id', r.id);
    if(error){ toast('저장 실패: '+error.message); b.disabled=false; return; }
    toast({approved:'인정했어요',held:'보완 요청을 보냈어요',rejected:'반려했어요',pending:'확인 중으로 돌렸어요'}[st]);
    A.memo=''; A.reasons=[];
    const list=A.list.filter(admMatch); const i=list.findIndex(x=>x.id===r.id);
    A.sel = (list[i+1]||list[i-1]||{}).id || null;
    admReview();
  });
}

    const esc=v=>{ const s=v==null?'':String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const csv='\ufeff'+cols.map(c=>c[1]).join(',')+'\n'+list.map(r=>cols.map(c=>esc(r[c[0]])).join(',')).join('\n');

    <div class="row"><button class="btn main" id="csvall">전체 CSV</button><button class="btn" id="csvok">인정 기록만 CSV</button></div></div>`;
  const dl=(rows, name)=>{
    const cols=['id','status','nickname','category','local_name','usage','story','keyring','tool','chip_code','chip_hex','no_match','area','place_id','lat','lng','loc_method','taken_at','taken_src','sun_elev','light','time_note','weather','photo1_taken_at','photo2_taken_at','created_at','share','review_memo','photo1_path','photo2_path'];
    const esc=v=>{ const s=v==null?'':String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const csv='﻿'+cols.join(',')+'\n'+rows.map(r=>cols.map(c=>esc(c==='nickname'?A.authors[r.author]:r[c])).join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=name; a.click();
  };
  $('#csvall').onclick=()=>dl(A.list, `${A.ed}-records-${new Date().toISOString().slice(0,10)}.csv`);
  $('#csvok').onclick=()=>dl(A.list.filter(r=>r.status==='approved'), `${A.ed}-approved-${new Date().toISOString().slice(0,10)}.csv`);
}

/* ================= 시작 ================= */
async function boot(){
  try{
    /* 주소만으로(colorhunters.app) 들어오면 로그인했더라도 컬러헌터스 랜딩부터. 울릉 기록 화면은 #/ (머리글 «내 기록») */
    if(!location.hash) history.replaceState(null, '', location.pathname+location.search+'#/home');
    const r=route();
    CUR = edOf(r); S.edLoaded = CUR.slug;
    await loadEdition().catch(()=>{});
    if(CUR.tool) loadChips(CUR.tool).catch(()=>{});
    if(r.startsWith('i/')){
      const {data:{session:cur}} = await sb.auth.getSession();
      if(cur && !cur.user.is_anonymous){
        /* 아이디로 로그인한 상태에서 개인 링크를 열면 그 사람 기록이 내 계정으로 넘어오므로 막는다 */
        history.replaceState(null,'', location.pathname+'#/');
        $('#view').innerHTML=`<div class="card stack"><h1 class="h2">이미 아이디로 로그인돼 있어요</h1><p>개인 링크는 아이디가 없는 분이 처음 한 번만 쓰는 링크예요. 다른 분의 링크라면 그분 휴대폰에서 열어 주세요.</p><button class="btn main block" id="tohome">내 기록으로</button></div>`;
        await loadMe(); await loadParts().catch(()=>{}); if(hasId()) await loadMine().catch(()=>{});
        $('#tohome').onclick=()=>render(); return;
      }
      $('#view').innerHTML='<div class="card"><p>초대 링크를 확인하고 있어요…</p></div>';
      try{ await redeem(r.slice(2).trim()); history.replaceState(null,'', location.pathname+'#/'); }
      catch(e){
        if(/use login/.test(e.message||'')){
          localStorage.removeItem('ch_invite'); localStorage.removeItem('ch_me');
          const {data:{session}} = await sb.auth.getSession();
          if(session && session.user.is_anonymous) await sb.auth.signOut().catch(()=>{});
          S.me=null; S.user=null;
          $('#view').innerHTML=`<div class="card stack"><h1 class="h2">이 링크는 이제 쓰지 않아요</h1><p>이미 아이디를 만드셨어요. 아이디와 비밀번호로 로그인해 주세요.</p><button class="btn main block" id="tologin">로그인</button></div>`; $('#tologin').onclick=()=>{ location.hash='#/login'; }; return;
        }
        $('#view').innerHTML=`<div class="card stack"><h1 class="h2">링크를 열지 못했어요</h1><p>링크가 잘못됐거나 인터넷이 약해요. 다시 눌러 보고, 계속 안 되면 단톡방에 알려 주세요.</p><p class="xs muted">${h(e.message||e)}</p></div>`; return; }
    } else {
      await loadMe();
    }
    if(!S.user){ const {data:{session}} = await sb.auth.getSession(); if(session) S.user = session.user; }
    await loadParts().catch(()=>{});
    if(hasId()){ await loadMine(); processQueue(); }
    render();
  }catch(e){
    console.error(e);
    $('#view').innerHTML=`<div class="card stack"><h1 class="h2">불러오지 못했어요</h1><p>인터넷 연결을 확인하고 새로고침해 주세요.</p><p class="xs muted">${h(e.message||e)}</p></div>`;
  }
}
boot();
</script>
